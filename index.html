<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F3EB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="마르스 비서실">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="마르스 님 전용 AI 비서실 — 스마트폰 브라우저에서 단독 실행되는 단일 HTML 앱">
<title>마르스 비서실</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
/* ============================================================
   마르스 비서실 — 모바일 단독판 스타일
   크림/베이지 톤 · 폰 우선(100dvh) · PC에서는 카드 형태로 중앙 정렬
   ============================================================ */
:root{
  --bg:#F7F3EB;
  --card:#FFFDF9;
  --cream:#FFFCF5;
  --line:#EFE4D3;
  --line-2:#E7DAC6;
  --ink:#3B2A1C;
  --ink-2:#6B5644;
  --ink-3:#9C8674;
  --brown:#7A4A22;
  --brown-d:#5E3616;
  --peach:#FBE3D5;
  --peach-line:#F5CDBB;
  --mint:#2E9E5B;
  --mint-bg:#EAF7EE;
  --amber:#B4720E;
  --amber-bg:#FFF4DC;
  --green:#2E8B57;
  --green-bg:#E9F6EE;
  --shadow:0 24px 60px rgba(120,90,50,.16);
  --safe-b:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;height:100%;padding:18px;
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(1200px 620px at 50% -12%, #FFF7E8 0%, rgba(255,247,232,0) 62%),
    radial-gradient(900px 500px at 100% 100%, #F2E7D6 0%, rgba(242,231,214,0) 55%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
.hide{display:none !important}

/* ───────── 앱 카드 ───────── */
.app{
  width:min(560px,100%);
  height:min(920px,calc(100vh - 36px));
  height:min(920px,calc(100dvh - 36px));
  display:flex;flex-direction:column;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:26px;
  box-shadow:var(--shadow),0 1px 0 #fff inset;
  overflow:hidden;position:relative;
}

/* ───────── 헤더 ───────── */
.hdr{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 11px;
  background:linear-gradient(180deg,#FFFDF9 0%,#FFFBF2 100%);
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.crest{
  width:42px;height:42px;flex:0 0 auto;display:grid;place-items:center;
  font-size:20px;border-radius:13px;
  background:linear-gradient(160deg,#FFF6D2 0%,#F8DE93 55%,#EFCB6E 100%);
  border:1px solid #E8CE8B;
  box-shadow:0 4px 10px rgba(200,160,80,.28),0 1px 0 #fff inset;
}
.brand-txt{min-width:0}
.brand h1{
  margin:0;font-size:17px;font-weight:800;letter-spacing:-.4px;
  color:#3A2A1B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sub{margin:2px 0 0;display:flex;align-items:center;gap:5px;font-size:11px;color:#7C6653;font-weight:600}
.sub .dot{width:6px;height:6px;border-radius:50%;background:#3FB268;box-shadow:0 0 0 2.5px rgba(63,178,104,.18)}
.hdr-right{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.live{
  display:flex;align-items:center;gap:5px;
  padding:5px 9px;border-radius:999px;
  background:var(--mint-bg);border:1px solid #CDEBD8;color:#2C8C55;
  font-size:10.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;
}
.live i{width:6px;height:6px;border-radius:50%;background:#35BF6A;box-shadow:0 0 0 0 rgba(53,191,106,.6);animation:pulse 2.4s infinite}
.live.off{background:#FFF3E2;border-color:#F3DCBB;color:#A9711B}
.live.off i{background:#D89A38;animation:none}
.live .short{display:none}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(53,191,106,.55)}
  70%{box-shadow:0 0 0 6px rgba(53,191,106,0)}
  100%{box-shadow:0 0 0 0 rgba(53,191,106,0)}
}
.gear{
  width:36px;height:36px;border-radius:11px;border:1px solid var(--line-2);
  background:#FFFCF4;font-size:15px;display:grid;place-items:center;
  transition:transform .15s,background .15s;
}
.gear:active{background:#FFF6E4;transform:scale(.96)}

/* ───────── 탭 ───────── */
.tabs{
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  padding:8px 9px;background:var(--cream);
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
.tab{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:50px;padding:6px 2px 7px;border:0;border-radius:14px;background:transparent;
  color:#7B6653;font-size:11px;font-weight:700;letter-spacing:-.3px;
  transition:background .18s,color .18s,box-shadow .18s,transform .12s;
}
.tab .ticon{font-size:16px;line-height:1;transition:filter .18s}
.tab:active{transform:scale(.97)}
.tab.active{
  background:linear-gradient(180deg,#8D5C2C 0%,#6A3F1C 100%);
  color:#fff;box-shadow:0 8px 18px rgba(107,66,28,.30),0 1px 0 rgba(255,255,255,.28) inset;
}
.tab.active .ticon{filter:saturate(1.15) brightness(1.05)}
.tab-badge{
  position:absolute;top:3px;right:calc(50% - 23px);
  min-width:16px;height:16px;padding:0 4px;border-radius:9px;
  background:#D2694A;color:#fff;font-size:9.5px;font-weight:800;
  display:grid;place-items:center;
}

/* ───────── 본문 ───────── */
.body{flex:1 1 auto;min-height:0;position:relative;background:var(--card)}
.view{display:none;flex-direction:column;height:100%;min-height:0}
.view.active{display:flex}

/* ───────── 회의실 ───────── */
.rooms{display:flex;gap:6px;padding:10px 12px 6px;overflow-x:auto;flex:0 0 auto;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.room{
  flex:0 0 auto;display:flex;align-items:center;gap:5px;
  min-height:36px;padding:7px 13px;border-radius:999px;
  border:1px solid var(--line-2);background:#FFFDF9;
  color:#6B5644;font-size:12px;font-weight:700;letter-spacing:-.3px;transition:.16s;
}
.room.active{background:#fff;border-color:#EBC5B4;color:#4A3123;box-shadow:0 3px 10px rgba(196,146,118,.22),0 0 0 2px rgba(251,227,213,.45)}

.roomline{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:2px 14px 7px;font-size:10.5px;font-weight:700;color:#8A6A4F;letter-spacing:-.2px;
  flex:0 0 auto;min-width:0;
}
.roomline-l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cost-chip{
  flex:0 0 auto;border:1px solid #F0E1C8;background:#FFF6E6;color:#96785B;
  font-size:10px;font-weight:700;padding:3.5px 8px;border-radius:999px;
}
.cost-chip:active{background:#FFEFD6}

.chat{
  flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:6px 12px 12px;display:flex;flex-direction:column;gap:11px;
  background:linear-gradient(180deg,#FFFDF9 0%,#FFFCF6 100%);
}
.chat::-webkit-scrollbar{width:6px}
.chat::-webkit-scrollbar-thumb{background:#E7D8C2;border-radius:3px}

.m-user{display:flex;justify-content:flex-end;align-items:flex-start;gap:6px}
.m-user .bubble{
  max-width:79%;padding:10px 13px;
  background:var(--peach);border:1px solid var(--peach-line);
  border-radius:16px 16px 4px 16px;
  font-size:13.5px;line-height:1.6;color:#4A2E23;
  white-space:pre-wrap;word-break:break-word;
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset;
}
.m-user .u-avatar{
  width:24px;height:24px;border-radius:50%;flex:0 0 auto;
  display:grid;place-items:center;font-size:12px;
  background:linear-gradient(160deg,#FFF3C8,#F2D488);border:1px solid #E9CD8C;
}
.m-time{font-size:9.5px;color:#B49C88;margin-top:4px;text-align:right}

.m-ai{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start}
.m-ai .a-avatar{
  width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13.5px;
  background:var(--tint,#F4E9D8);border:1px solid rgba(120,90,50,.10);
  box-shadow:0 1px 0 #fff inset;
}
.m-ai .a-body{min-width:0}
.m-ai .a-head{display:flex;align-items:baseline;gap:6px;margin:1px 0 4px;flex-wrap:wrap}
.m-ai .a-name{font-size:12px;font-weight:800;color:#43301F;letter-spacing:-.3px}
.m-ai .a-title{font-size:10px;font-weight:600;color:#A28C78}
.m-ai .a-time{font-size:10px;color:#B7A492}
.tag{font-size:9px;font-weight:800;padding:1px 5px;border-radius:6px;letter-spacing:-.2px;background:#F1E7D6;color:#967A5A}
.tag.ai{background:#E7F0FB;color:#3E6F9E}
.tag.err{background:#FDECEA;color:#B04A32}
.m-ai .bubble{
  background:#FDF8EE;border:1px solid #EFE3CF;
  border-radius:4px 14px 14px 14px;
  padding:10px 13px;font-size:13.5px;line-height:1.62;color:#3E2E20;
  white-space:pre-wrap;word-break:break-word;
  box-shadow:0 1px 0 rgba(255,255,255,.75) inset;
}
.m-sys{align-self:center;font-size:10.5px;color:#A28C78;background:#F8F0E2;
  border:1px dashed #E6D6BE;border-radius:999px;padding:4px 10px;text-align:center;line-height:1.5}

.typing{display:flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:#C9B49B;animation:bounce 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.55}30%{transform:translateY(-4px);opacity:1}}

/* ───────── 입력 바 ───────── */
.composer{
  flex:0 0 auto;border-top:1px solid var(--line);
  background:linear-gradient(180deg,#FFFDF8,#FFFBF1);
  padding:8px 10px calc(9px + var(--safe-b));
}
.chip-row{display:flex;align-items:center;gap:5px;padding-bottom:7px;overflow-x:auto;scrollbar-width:none;min-width:0}
.chip-row::-webkit-scrollbar{display:none}
.chip-row.mentions{padding-bottom:8px}
.chip-row.scroll-x{
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),rgba(0,0,0,0) 100%);
}
.lbl{font-size:10px;font-weight:700;color:#A08A76;flex:0 0 auto;padding-left:2px}
.chips{display:flex;gap:5px;flex:0 0 auto}
.chip{
  flex:0 0 auto;display:flex;align-items:center;gap:3px;
  min-height:34px;padding:6px 10px;border-radius:999px;border:1px solid var(--line-2);
  background:#fff;color:#5E4835;font-size:11px;font-weight:700;letter-spacing:-.4px;
  transition:.15s;white-space:nowrap;touch-action:manipulation;
}
.chip.active{background:linear-gradient(180deg,#8D5C2C,#6A3F1C);color:#fff;border-color:#5F3714;box-shadow:0 4px 10px rgba(107,66,28,.26)}
.chip.mention{border-style:dashed;background:#FFFCF5;color:#8A6A4F;font-weight:600}
.chip.mention:active{background:#FFF6E4;border-style:solid}
.inputbar{display:flex;gap:8px;align-items:flex-end}
#input{
  flex:1;min-width:0;min-height:44px;max-height:112px;resize:none;
  padding:11px 13px;border-radius:14px;border:1px solid var(--line-2);
  background:#fff;font-size:13.5px;line-height:1.5;
  outline:none;transition:border-color .15s,box-shadow .15s;
}
#input::placeholder{color:#B8A492}
#input:focus{border-color:#CB9F72;box-shadow:0 0 0 3px rgba(203,159,114,.16)}
.send{
  width:46px;height:46px;flex:0 0 auto;border:0;border-radius:14px;
  background:linear-gradient(180deg,#8D5C2C,#6A3F1C);color:#fff;font-size:16px;
  display:grid;place-items:center;box-shadow:0 6px 14px rgba(107,66,28,.28);
  transition:transform .12s,opacity .15s;touch-action:manipulation;
}
.send:active{transform:scale(.95)}
.send:disabled{opacity:.45;box-shadow:none;cursor:default}

/* ───────── 공통 뷰 ───────── */
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:15px 16px 9px;flex:0 0 auto}
.view-head h2{margin:0;font-size:16px;font-weight:800;letter-spacing:-.5px;color:#3A2A1B}
.view-sub{margin:3px 0 0;font-size:11px;color:#9C8674;font-weight:600}
.btn{
  border-radius:11px;border:1px solid var(--line-2);background:#fff;
  padding:9px 12px;font-size:12px;font-weight:700;color:#5E4835;transition:.15s;touch-action:manipulation;
}
.btn:active{background:#FFF8EA}
.btn.primary{background:linear-gradient(180deg,#8D5C2C,#6A3F1C);color:#fff;border-color:#5F3714;box-shadow:0 4px 10px rgba(107,66,28,.22)}
.btn.ghost{background:#FFFCF5}
.btn.mini{padding:6px 10px;font-size:11px;border-radius:9px}
.btn.danger{color:#B04A32;border-color:#EFCFC4;background:#FFF7F4}

.filters{display:flex;gap:6px;padding:0 16px 10px;flex:0 0 auto}
.f-chip{
  border:1px solid var(--line-2);background:#FFFCF5;color:#7B6653;
  border-radius:999px;min-height:34px;padding:6px 13px;font-size:11.5px;font-weight:700;
}
.f-chip.active{background:#5E4633;color:#fff;border-color:#4A3524}

.list{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:0 16px 18px;display:flex;flex-direction:column;gap:9px}
.list > *{flex:0 0 auto}
.list::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb{background:#E7D8C2;border-radius:3px}
.empty{text-align:center;color:#A89480;font-size:12px;line-height:1.8;padding:30px 16px;
  border:1px dashed #E8D9C2;border-radius:16px;background:#FFFCF5}

.task{
  position:relative;background:#FFFCF5;border:1px solid var(--line);
  border-left:4px solid var(--tc,#C9A277);border-radius:13px;padding:11px 12px 10px;
}
.task.done{opacity:.62;background:#FAF7F0}
.task-top{display:flex;align-items:flex-start;gap:8px}
.task-title{flex:1;font-size:12.5px;font-weight:800;color:#3E2E20;line-height:1.45;letter-spacing:-.3px;word-break:break-word}
.task.done .task-title{text-decoration:line-through;text-decoration-color:#C9B6A0}
.pill{flex:0 0 auto;font-size:9.5px;font-weight:800;padding:2.5px 7px;border-radius:999px;letter-spacing:-.2px;border:1px solid transparent;white-space:nowrap}
.pill.대기{background:#F1ECE3;color:#7E6C58;border-color:#E4DBCC}
.pill.진행중{background:var(--amber-bg);color:var(--amber);border-color:#F2DCAE}
.pill.완료{background:var(--green-bg);color:var(--green);border-color:#CBE8D6}
.task-meta{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap;font-size:10.5px;color:#9C8674;font-weight:600}
.task-meta .owner{display:flex;align-items:center;gap:3px;color:#6B5644}
.task-detail{margin:7px 0 0;font-size:11.5px;color:#7B6653;line-height:1.55;padding-top:7px;border-top:1px dashed #EADFCB;word-break:break-word}
.task-actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}

.staff{background:#FFFCF5;border:1px solid var(--line);border-radius:15px;padding:13px;position:relative;overflow:hidden}
.staff::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--tc,#C9A277),transparent 85%)}
.staff-top{display:flex;align-items:center;gap:10px}
.staff-avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;
  background:var(--tint,#F4E9D8);border:1px solid rgba(120,90,50,.10)}
.staff-id{flex:1;min-width:0}
.staff-name{font-size:13.5px;font-weight:800;color:#3A2A1B;letter-spacing:-.3px}
.staff-role{font-size:10.5px;color:#9C8674;font-weight:600;margin-top:1px}
.staff-state{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:800;color:var(--green);
  background:var(--green-bg);border:1px solid #CBE8D6;padding:3px 8px;border-radius:999px;white-space:nowrap}
.staff-state.busy{color:var(--amber);background:var(--amber-bg);border-color:#F2DCAE}
.staff-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:11px}
.stat{background:#FFF8EC;border:1px solid #F0E4D2;border-radius:10px;padding:7px 8px;text-align:center}
.stat b{display:block;font-size:14px;font-weight:800;color:#5E4633;letter-spacing:-.4px}
.stat span{font-size:9.5px;color:#A89480;font-weight:700}
.staff-report{margin-top:10px;font-size:11px;color:#7B6653;line-height:1.55;background:#FFFDF8;
  border:1px dashed #EADFCB;border-radius:10px;padding:8px 10px;word-break:break-word}
.staff-report b{display:block;font-size:9.5px;color:#A89480;font-weight:800;margin-bottom:2px}
.staff-foot{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.edit-grid{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.edit-grid label{font-size:10px;font-weight:800;color:#A89480}
.edit-grid input{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line-2);font-size:13px;outline:none;background:#fff}
.edit-grid input:focus{border-color:#CB9F72}

.newtask{margin:0 16px 10px;padding:11px;border-radius:13px;background:#FFF7E9;border:1px solid #F0E1C8;
  display:flex;flex-direction:column;gap:7px}
.newtask input{width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line-2);font-size:13px;outline:none;background:#fff}
.newtask-row{display:flex;gap:6px;align-items:center}
.newtask select{flex:1;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--line-2);font-size:12.5px;background:#fff;outline:none}

.memo-add{margin:0 16px 10px;display:flex;flex-direction:column;gap:7px;flex:0 0 auto}
.memo-add textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line-2);
  font-size:13px;line-height:1.55;resize:none;outline:none;background:#fff}
.memo-add textarea:focus{border-color:#CB9F72;box-shadow:0 0 0 3px rgba(203,159,114,.15)}
.memo-add-row{display:flex;gap:6px}
.memo-add-row input{flex:1;min-width:0;padding:9px 11px;border-radius:10px;border:1px solid var(--line-2);font-size:13px;outline:none;background:#fff}
.searchbar{padding:0 16px 10px;flex:0 0 auto}
.searchbar input{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line-2);font-size:13px;outline:none;background:#FFFDF8}
.searchbar input:focus{border-color:#CB9F72;background:#fff}
.memo{background:#FFFDF5;border:1px solid var(--line);border-left:4px solid #E4C88F;border-radius:12px;padding:10px 12px}
.memo-text{font-size:12.5px;line-height:1.6;color:#3E2E20;white-space:pre-wrap;word-break:break-word}
.memo-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}
.memo-meta{font-size:10px;color:#A89480;font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.memo-tag{background:#F6EBD6;color:#96744A;border-radius:6px;padding:1px 6px;font-size:9.5px;font-weight:800}
.memo-del{border:0;background:none;color:#C2A891;font-size:13px;padding:3px 5px}

/* ───────── 설정 시트 ───────── */
.overlay{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:14px;background:rgba(60,42,24,.34);backdrop-filter:blur(3px);animation:fade .18s ease-out;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:min(470px,100%);max-height:90dvh;max-height:90vh;display:flex;flex-direction:column;
  background:var(--card);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 30px 70px rgba(60,40,20,.32);overflow:hidden;
  animation:rise .22s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes rise{from{transform:translateY(14px) scale(.985);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
  border-bottom:1px solid var(--line);background:#FFFCF5}
.sheet-head h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.4px;color:#3A2A1B}
.x{border:0;background:none;font-size:16px;color:#A89480;padding:6px;line-height:1}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 16px 6px}
.sheet-body::-webkit-scrollbar{width:6px}
.sheet-body::-webkit-scrollbar-thumb{background:#E7D8C2;border-radius:3px}
.sheet-foot{display:flex;gap:8px;justify-content:flex-end;padding:11px 16px calc(11px + var(--safe-b));
  border-top:1px solid var(--line);background:#FFFCF5}
.sec{margin-bottom:16px}
.sec-title{font-size:10.5px;font-weight:800;color:#A89480;letter-spacing:.2px;margin:0 0 7px;
  display:flex;align-items:center;gap:5px}
.field{margin-bottom:9px}
.field label{display:block;font-size:10.5px;font-weight:700;color:#8A7159;margin-bottom:4px}
.field input,.field select{width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line-2);
  font-size:13px;outline:none;background:#fff}
.field input:focus,.field select:focus{border-color:#CB9F72;box-shadow:0 0 0 3px rgba(203,159,114,.15)}
.hint{font-size:10.5px;color:#A89480;margin-top:4px;line-height:1.55}
.field .hint{font-size:10px;margin-top:4px;line-height:1.5}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line-2);border-radius:11px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:#fff;padding:10px 8px;font-size:12px;font-weight:700;color:#7B6653}
.seg button.on{background:linear-gradient(180deg,#8D5C2C,#6A3F1C);color:#fff}
.box{background:#FFF9EE;border:1px solid #F0E1C8;border-radius:12px;padding:11px 12px}
.usage-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.usage-cell{background:#fff;border:1px solid #F0E4D2;border-radius:9px;padding:7px 9px}
.usage-cell span{display:block;font-size:9.5px;color:#A89480;font-weight:700}
.usage-cell b{font-size:13px;font-weight:800;color:#5E4633;letter-spacing:-.3px}
.notice{font-size:10.5px;line-height:1.65;color:#8A7159;background:#FFF9EE;border:1px solid #F0E1C8;
  border-left:3px solid #D9B877;border-radius:9px;padding:8px 10px}
.notice b{color:#6B4A28}
.status-line{font-size:11px;font-weight:700;margin-top:6px;line-height:1.5}
.status-line.ok{color:var(--green)}
.status-line.err{color:#B04A32}
.howto{font-size:11px;line-height:1.75;color:#6B5644}
.howto b{color:#5E3616}
.howto ol{margin:4px 0 0;padding-left:17px}
.howto li{margin-bottom:2px}

/* ───────── 토스트 ───────── */
.toast-wrap{position:fixed;left:50%;bottom:190px;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:8px;align-items:center;z-index:80;
  pointer-events:none;width:max-content;max-width:92vw}
.toast{background:rgba(58,42,27,.94);color:#FFF8EC;font-size:12px;font-weight:600;
  padding:10px 15px;border-radius:12px;box-shadow:0 12px 30px rgba(40,25,10,.3);
  animation:toastIn .22s ease-out;max-width:92vw;text-align:center;line-height:1.5}
@keyframes toastIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* ───────── 폰 화면 ───────── */
@media (max-width:640px){
  body{padding:0;display:block;height:100dvh;overflow:hidden;background:var(--card)}
  .app{width:100%;height:100dvh;max-height:100dvh;border:0;border-radius:0;box-shadow:none}
  #input{font-size:16px;min-height:46px}
  .m-user .bubble,.m-ai .bubble{font-size:14px}
  .memo-add textarea,.memo-add-row input,.searchbar input,.newtask input,.field input,.field select{font-size:16px}
}
@media (max-width:400px){
  .brand h1{font-size:15.5px}
  .crest{width:38px;height:38px;font-size:18px;border-radius:12px}
  .hdr{padding-left:12px;padding-right:12px;gap:6px}
  .live span.long{display:none}
  .live span.short{display:inline}
  .live{padding:6px 9px;font-size:10px}
  .tab{font-size:10.5px}
  .tab .ticon{font-size:15px}
  .chip-row .lbl{display:none}
  .chip-row{gap:3px}
  .chips{gap:3px}
  .chip{font-size:10.5px;padding:6px 7px;gap:2px}
  .toast-wrap{bottom:196px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

<script>
/* ============================================================
   마르스 비서실 — 모바일 단독판 (단일 HTML, 서버 없음)

  function pad2(n) { return String(n).padStart(2, '0'); }

    const x = d || new Date();
    return x.getFullYear() + '-' + pad2(x.getMonth() + 1) + '-' + pad2(x.getDate());
  }
  function today() { return dayKey(); }

  function timeLabel(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
  }
  function dayLabel(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return (d.getMonth() + 1) + '.' + d.getDate() + ' ' + d.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
  }
  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return Math.abs(h);
  }
  const pick = (arr, seed) => arr[seed % arr.length];

  /* ───────── 이 기기 저장소 ─────────
     file:// 나 content:// 로 열면 localStorage가 막힐 수 있습니다.
     막히면 메모리에 보관하고, 화면 배지로 알린 뒤 JSON 백업을 권합니다. */
  const LS_STATE = 'mars_secretary_mobile_state_v1';
  const LS_API = 'mars_secretary_mobile_gemini_v1';
  const LS_PROBE = 'mars_secretary_mobile_probe';
  const memStore = Object.create(null);

  function probeStore() {
    try {
      localStorage.setItem(LS_PROBE, '1');

  }
  function storeGet(k) {
    try {
      const v = localStorage.getItem(k);
      if (v != null) return v;
    } catch (e) { storeOK = false; }
    return Object.prototype.hasOwnProperty.call(memStore, k) ? memStore[k] : null;
  }
  function storeSet(k, v) {
    memStore[k] = v;
    try { localStorage.setItem(k, v); return true; }
    catch (e) { storeOK = false; return false; }
  }
  function storeDel(k) {
    delete memStore[k];
    try { localStorage.removeItem(k); } catch (e) { storeOK = false; }
  }

  /* ───────── 기본 상태 ───────── */
  const DEFAULT_ASSISTANTS = () => ([
    {
      id: 'nike', name: '니케', emoji: '🪽', title: '총괄 비서', tint: '#F3E7D6', color: '#8A5A2B',

    return {

        ],

          { id: uid('m'), type: 'assistant', senderId: 'nike', text: '네, 대장님! 마르스 비서실 문 열었습니다.\n지시는 @니케·@홍보니·@셈순이·@공돌이, 또는 @all로 내려주세요. 지목된 비서가 먼저 "실행하겠습니다" 보고를 올리고 작업실에 카드를 만듭니다. 🪽', at: t },

          { id: uid('m'), type: 'assistant', senderId: 'semsoon', text: '세금계산서·미수금·거래처 대조는 제 몫입니다. 금액이 걸린 건은 제가 임의로 손대지 않고 확인 받고 움직이겠습니다, 대장님. 🧾', at: t },

      settings: {

  /* ───────── 상태 ───────── */
  let state = null;
  const ai = { apiKey: '', enabled: false, masked: '' };
  let busy = false;
  let saveTimer = null;
  const draft = {};

  function migrate(s) {
    const d = defaultState();
    if (!s || typeof s !== 'object' || Array.isArray(s)) return d;
    const out = Object.assign({}, d, s);
    out.profile = Object.assign({}, d.profile, s.profile || {});
    out.settings = Object.assign({}, d.settings, s.settings || {});

    });
    if (!Array.isArray(out.rooms) || !out.rooms.length) out.rooms = d.rooms;
    if (!out.messages || typeof out.messages !== 'object') out.messages = {};
    out.rooms.forEach((r) => { if (!Array.isArray(out.messages[r.id])) out.messages[r.id] = []; });
    if (!Array.isArray(out.tasks)) out.tasks = [];
    if (!Array.isArray(out.memos)) out.memos = [];
    if (!out.usage || typeof out.usage !== 'object' || Array.isArray(out.usage)) out.usage = {};
    if (!out.rooms.some((r) => r.id === out.activeRoom)) out.activeRoom = out.rooms[0].id;
    if (!['chat', 'tasks', 'staff', 'memo'].includes(out.ui.tab)) out.ui.tab = 'chat';
    return out;
  }

  /* ───────── 사용량·비용 (이 기기 집계) ───────── */
  const USD_KRW = 1400;
  const PRICING = {
    'gemini-3.5-flash-lite': { in: 0.30, out: 2.50 },
    'gemini-2.5-flash-lite': { in: 0.10, out: 0.40 },
    'gemini-3.5-flash': { in: 0.30, out: 2.50 }
  };
  function priceOf(model) { return PRICING[model] || PRICING['gemini-3.5-flash-lite']; }
  function estimateCost(model, pt, ot) {
    const p = priceOf(model);
    const usd = (pt / 1e6) * p.in + (ot / 1e6) * p.out;
    return { usd: Number(usd.toFixed(8)), krw: Number((usd * USD_KRW).toFixed(4)) };
  }
  function emptyUsage() { return { calls: 0, promptTokens: 0, outputTokens: 0, usd: 0, krw: 0 }; }
  function usageToday() {
    const u = (state && state.usage) || {};
    return Object.assign(emptyUsage(), u[today()] || {});
  }
  function usageMonth() {
    const m = emptyUsage();
    const prefix = today().slice(0, 7);
    const u = (state && state.usage) || {};
    Object.keys(u).forEach((k) => {
      if (k.slice(0, 7) !== prefix) return;
      const d = u[k] || {};
      m.calls += d.calls || 0;
      m.promptTokens += d.promptTokens || 0;
      m.outputTokens += d.outputTokens || 0;
      m.krw += Number(d && d.krw) || 0;
    });
    m.krw = Number(m.krw.toFixed(4));
    return m;
  }
  function recordUsage(model, pt, ot) {
    const c = estimateCost(model, pt, ot);
    if (!state.usage) state.usage = {};
    const k = today();
    const d = Object.assign(emptyUsage(), state.usage[k] || {});
    d.calls += 1;
    d.promptTokens += pt;
    d.outputTokens += ot;
    d.usd = Number((d.usd + c.usd).toFixed(8));
    d.krw = Number((d.krw + c.krw).toFixed(4));
    state.usage[k] = d;
    const keys = Object.keys(state.usage).sort();
    while (keys.length > 40) { delete state.usage[keys.shift()]; }
    return c;
  }
  function wonText(krw) {
    const n = Number(krw || 0);
    if (n <= 0) return '0원';
    if (n < 1) return n.toFixed(2) + '원';
    if (n < 100) return n.toFixed(1) + '원';
    return Math.round(n).toLocaleString('ko-KR') + '원';
  }

  }

  /* ───────── 멘션·주제 분석 ───────── */
  function parseTargets(text) {
    const raws = (text.match(/@[^\s@,]+/g) || []).map((s) => s.slice(1).replace(/[.,!?~)"']+$/, ''));
    if (!raws.length) return [state.assistants[0]];
    const norm = (s) => String(s).replace(/\s|_/g, '').toLowerCase();
    const ids = [];
    for (const raw of raws) {
      const r = norm(raw);
      if (['all', '전체', '모두', '비서진', '팀'].includes(r)) return state.assistants.slice();
      const hit = state.assistants.find((a) =>
        norm(a.name) === r || norm(String(a.title || '').replace('비서', '')) === r ||
        (a.aliases || []).some((al) => norm(al) === r)
      );
      if (hit && !ids.includes(hit.id)) ids.push(hit.id);
    }
    if (!ids.length) return [state.assistants[0]];
    return ids.map((id) => assistantById(id)).filter(Boolean);
  }

  function summarize(text, max) {
    let t = String(text).replace(/@[^\s@,]+/g, '').replace(/\s+/g, ' ').trim();
    t = t.replace(/^(좀|제발|지금|바로)\s+/g, '');
    if (!t) t = '지시 처리';
    const lim = max || 34;
    if (t.length <= lim) return t;
    const cut = t.slice(0, lim);
    const sp = cut.lastIndexOf(' ');
    const head = sp > lim * 0.55 ? cut.slice(0, sp) : cut;
    return head.replace(/[\s,·]$/, '') + '…';
  }

  /* ───────── AI 판단 (비용 절감) ───────── */
  const DEEP_KW = /(기획|아이디어|문안|카피|작성|써\s?줘|써줄|만들|분석|전략|비교|추천|조언|검토|요약|번역|계획|제안|어떻게|왜|알려|찾아|리스트|뽑아|짜\s?줘|보고서|초안|문장|제목|방법|순서|일정표|대본|스크립트)/;
  const SHALLOW_START = /^(접수|등록|처리|진행|실행|확인|알림|보고|올려|보내|잡아|해줘|해라|부탁|시작|완료)/;

  function looksDeep(text) {
    const t = text.replace(/@[^\s@,]+/g, '').trim();
    if (!t) return false;
    if (t.length <= 6) return false;
    if (DEEP_KW.test(t)) return true;
    if (SHALLOW_START.test(t) && t.length < 40) return false;
    return t.length >= 45;
  }
  function shouldUseAI(text) {
    if (!ai.enabled) return false;
    if (state.settings.responseMode === 'always') return true;
    return looksDeep(text);
  }

  function normalizeModel(m) {
    const s = String(m || '').trim() || 'gemini-3.5-flash-lite';

  /* ───────── Gemini REST 직접 호출 (브라우저 → Google) ───────── */
  const API_BASE = 'https://generativelanguage.googleapis.com/v1beta/models/';

  function friendlyApiError(status, body) {
    const err = (body && body.error) || {};
    const msg = String(err.message || (typeof body === 'string' ? body : '') || '').slice(0, 240);
    const st = err.status || String(status);
    if (/API_KEY_INVALID|API key not valid|invalid api key/i.test(msg)) {
      return 'API 키가 유효하지 않습니다. Google AI Studio에서 키를 다시 확인해 주세요.';
    }
    if (/API key expired|expired/i.test(msg)) {
      return 'API 키가 만료되었습니다. Google AI Studio에서 새 키를 발급해 주세요.';
    }
    if (status === 403) return '이 키로는 해당 모델을 쓸 수 없습니다(403). AI Studio에서 키 권한을 확인해 주세요.';
    if (status === 429) return 'Gemini 사용 한도를 초과했습니다. 잠시 후 다시 시도해 주세요.';
    if (status === 404 || /not found|NOT_FOUND/i.test(msg)) {
      return '모델 이름을 찾을 수 없습니다. 설정에서 gemini-3.5-flash-lite로 바꿔 주세요.';
    }
    if (status === 400 && /API key/i.test(msg)) return 'API 키가 올바르지 않습니다(400). 키를 다시 확인해 주세요.';
    return 'Gemini 호출에 실패했습니다(' + st + '): ' + (msg || '알 수 없는 오류');
  }

  async function callGemini(opts) {
    const o = opts || {};
    if (!ai.apiKey) {
      throw new Error('API 키가 없습니다. ⚙️ 설정에서 Google AI Studio 키를 먼저 저장해 주세요.');
    }
    const useModel = normalizeModel(o.model || state.settings.model);
    const contents = [];
    const push = (role, text) => {
      const t = String(text || '').trim();
      if (!t) return;
      const last = contents[contents.length - 1];
      if (last && last.role === role) last.parts[0].text += '\n' + t;
      else contents.push({ role, parts: [{ text: t }] });
    };
    (Array.isArray(o.history) ? o.history : []).slice(-16).forEach((h) => {
      push(h.role === 'model' || h.role === 'assistant' ? 'model' : 'user', h.text);
    });
    push('user', o.prompt || '안녕하세요');
    while (contents.length && contents[0].role === 'model') contents.shift();
    if (!contents.length) contents.push({ role: 'user', parts: [{ text: '안녕하세요' }] });

    const gen = { temperature: o.json ? 0.9 : 0.85, maxOutputTokens: o.json ? 900 : 512, topP: 0.95 };
    if (o.json) {
      gen.responseMimeType = 'application/json';
      gen.responseSchema = {
        type: 'ARRAY',
        items: {
          type: 'OBJECT',
          properties: { id: { type: 'STRING' }, text: { type: 'STRING' } },
          required: ['id', 'text']
        }
      };
    }
    const payload = { contents, generationConfig: gen };
    const sys = String(o.system || '').trim();
    if (sys) payload.systemInstruction = { parts: [{ text: sys }] };

    const url = API_BASE + encodeURIComponent(useModel) + ':generateContent?key=' + encodeURIComponent(ai.apiKey);
    const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const limit = o.timeoutMs || 60000;
    const timer = ctrl ? setTimeout(() => { try { ctrl.abort(); } catch (e) { /* 무시 */ } }, limit) : null;

    let res;
    try {
      res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: ctrl ? ctrl.signal : undefined
      });
    } catch (e) {
      if (timer) clearTimeout(timer);
      if (e && e.name === 'AbortError') {
        throw new Error('응답 시간이 초과되었습니다(' + Math.round(limit / 1000) + '초). 인터넷 상태를 확인한 뒤 다시 시도해 주세요.');
      }
      throw new Error('인터넷에 연결하지 못했습니다. Wi-Fi·모바일 데이터를 확인해 주세요. (브라우저가 외부 연결을 막는 경우도 있습니다)');
    }
    if (timer) clearTimeout(timer);

    const raw = await res.text();
    let body = null;
    try { body = JSON.parse(raw); } catch (e) { body = null; }

    if (!res.ok) throw new Error(friendlyApiError(res.status, body || raw));

    const j = body || {};
    const blockReason = j.promptFeedback && j.promptFeedback.blockReason;
    if (blockReason) throw new Error('요청이 안전 정책에 걸렸습니다(' + blockReason + '). 표현을 바꿔 다시 시도해 주세요.');
    const cand = (j.candidates || [])[0];
    const parts = (cand && cand.content && cand.content.parts) || [];
    const text = parts.map((p) => p.text || '').join('').trim();
    if (!text) throw new Error('Gemini가 빈 응답을 돌려줬습니다. 다시 시도해 주세요.');

    const um = j.usageMetadata || {};
    const promptTokens = um.promptTokenCount || 0;
    const outputTokens = (um.candidatesTokenCount || 0) + (um.thoughtsTokenCount || 0);
    const cost = recordUsage(useModel, promptTokens, outputTokens);

    let items = null;
    if (o.json) {
      const cleaned = text.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
      try {
        const parsed = JSON.parse(cleaned);
        if (Array.isArray(parsed)) items = parsed;
      } catch (e) { items = null; }
    }
    return {
      text, items, model: useModel,
      usage: { promptTokens, outputTokens, totalTokens: um.totalTokenCount || (promptTokens + outputTokens) },
      cost: { usd: cost.usd, krw: cost.krw }
    };
  }

  /* AI가 돌려준 텍스트에서 [{id,text}] 배열을 최대한 너그럽게 건져낸다 */
  function parseItems(text) {
    const raw = String(text || '').trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
    let v = null;
    try { v = JSON.parse(raw); } catch (e) {
      const m = raw.match(/\[[\s\S]*\]/);
      if (m) { try { v = JSON.parse(m[0]); } catch (e2) { v = null; } }
    }
    if (Array.isArray(v)) return v;
    if (v && typeof v === 'object') {
      for (const k of ['items', 'replies', 'data', 'result']) if (Array.isArray(v[k])) return v[k];
      const arr = Object.keys(v).map((k) => ({
        id: k,
        text: typeof v[k] === 'string' ? v[k] : ((v[k] && v[k].text) || '')
      })).filter((x) => x.text);
      if (arr.length) return arr;
    }
    return null;
  }

  async function aiReplyBatch(targets, text) {
    const res = await callGemini({
      system: buildSystem(targets),
      history: historyForAI(),
      prompt: '대장님 지시: ' + text.replace(/@[^\s@,]+/g, '').trim(),
      model: state.settings.model,
      json: true
    });
    const items = Array.isArray(res.items) ? res.items : parseItems(res.text);
    const out = {};
    if (Array.isArray(items)) {
      items.forEach((it) => {
        if (!it) return;
        const id = String(it.id || '').trim();
        const t = String(it.text || it.content || '').trim();
        if (!t) return;
        const match = targets.find((a) => a.id === id || a.name === id);
        if (match) out[match.id] = t;
      });
    }
    const got = Object.keys(out).length;
    if (!got) {
      // 여러 명 합본인데 형식을 못 읽었으면 엉뚱한 응답을 붙이지 않고 로컬 응답으로 대체
      if (targets.length === 1) {
        out[targets[0].id] = String(res.text || '').trim();
      } else {
        return { map: {}, usage: res.usage, cost: res.cost, model: res.model, fallbackLocal: true };
      }
    }
    return { map: out, usage: res.usage, cost: res.cost, model: res.model };
  }

  /* ───────── 메시지·작업 ───────── */
  function addMessage(m) {
    const list = state.messages[state.activeRoom];
    list.push(Object.assign({ id: uid('m'), at: nowISO() }, m));
    if (list.length > 400) list.splice(0, list.length - 400);
  }

  function showTyping(a) {
    const wrap = $('#chatScroll');
    const el = document.createElement('div');
    el.className = 'm-ai';
    el.id = 'typingRow';
    el.style.setProperty('--tint', a.tint);
    el.innerHTML = '<div class="a-avatar">' + esc(a.emoji) + '</div>' +
      '<div class="a-body"><div class="a-head"><span class="a-name">' + esc(a.name) + ' 비서</span>' +

      '<div class="bubble" style="padding:0"><div class="typing"><i></i><i></i><i></i></div></div></div>';
    wrap.appendChild(el);
    wrap.scrollTop = wrap.scrollHeight;

  function hideTyping() {
    const el = $('#typingRow');
    if (el) el.remove();

  function touchAssistant(a, report) {
    if (a.countDate !== today()) { a.countDate = today(); a.todayCount = 0; }
    a.todayCount += 1;
    if (report) a.lastReport = report;
    a.status = '대기중';
  }

  function makeTask(a, text) {
    return {
      id: uid('t'),
      title: taskTitleFor(a, text),
      detail: text.replace(/\s+/g, ' ').trim(),
      ownerId: a.id,
      status: '대기',
      room: state.activeRoom,
      createdAt: nowISO(),
      doneAt: null,
      source: '지시'
    };
  }

  function taskTitleFor(a, text) {
    const body = text.replace(/@[^\s@,]+/g, ' ').trim();
    const segs = body.split(/[,，、·]|그리고|및\s/)
      .map((s) => s.trim().replace(/^(그리고|및)\s*/, '').replace(/\s*(하고|하며|면서|이고|이고요)$/, '').replace(/[.,]$/, '').trim())
      .filter((s) => s.length > 3);
    if (segs.length > 1) {
      const pref = {
        hongbo: /(블로그|쇼츠|릴스|인스타|스레드|유튜브|홍보|콘텐츠|게시|카드뉴스)/,
        semsoon: /(세금|미수|거래|청구|정산|입금|결제|부가세|영수증)/,
        gongdol: /(as|수리|출장|복사기|프린터|PC|설치|부품|개발)/i
      }[a.id];
      if (pref) {
        const hit = segs.find((s) => pref.test(s));
        if (hit) return summarize(hit, 40);
      }
    }
    return summarize(text);
  }

  /* ───────── 전송 ───────── */
  async function send() {
    if (busy) return;
    const input = $('#input');
    const text = input.value.trim();
    if (!text) return;
    const senderId = state.ui.senderId || 'owner';
    busy = true;
    $('#btnSend').disabled = true;

    addMessage({ type: senderId === 'owner' ? 'user' : 'assistant', senderId, text });
    input.value = '';
    input.style.height = 'auto';
    save();
    renderChatOnly(true);

    if (senderId !== 'owner') {
      const a = assistantById(senderId);
      if (a) a.lastReport = '직접 남긴 메모: ' + summarize(text, 40);
      busy = false; $('#btnSend').disabled = false;
      save(); renderAll();
      toast((a ? a.emoji + ' ' + a.name : '비서') + ' 명의로 남겼습니다.');
      return;
    }

    const targets = parseTargets(text);
    if (isChitChat(text)) {
      const a = targets[0] || state.assistants[0];
      await respondOne(a, chatReply(a, text), 380);
      busy = false; $('#btnSend').disabled = false;
      save(); renderAll();
      return;
    }

    const useAI = shouldUseAI(text);
    if (useAI) {
      draft.typingId = targets[0].id;
      showTyping(targets[0]);
      renderStaff();
      try {
        const t0 = Date.now();
        const res = await aiReplyBatch(targets, text);
        const elapsed = Date.now() - t0;
        hideTyping();
        if (res.fallbackLocal) {
          addMessage({ type: 'system', text: 'AI 응답 형식을 읽지 못해 이번 지시는 로컬 응답으로 대체했습니다.' });
          renderChatOnly(true);
        }
        for (const a of targets) {
          const body = res.map[a.id] || smartReply(a, text).text;
          addMessage({ type: 'assistant', senderId: a.id, text: body, tag: res.map[a.id] ? 'AI' : '로컬' });
          state.tasks.unshift(makeTask(a, text));
          touchAssistant(a, summarize(body, 60));
          renderChatOnly(true);
          await sleep(240);
        }
        draft.typingId = null;
        busy = false; $('#btnSend').disabled = false;
        save(); renderAll();
        if (res.cost && res.cost.krw != null) {
          toast('🤖 AI 1회 호출 · ' + targets.length + '명 응답 · 약 ' + wonText(res.cost.krw) + ' (' + (elapsed / 1000).toFixed(1) + '초)');
        } else {
          toast('🤖 AI 응답 완료 · ' + targets.length + '명 (합본 1회 호출)');
        }
        return;
      } catch (e) {
        hideTyping();
        draft.typingId = null;
        toast('⚠️ AI 호출 실패: ' + e.message);
        addMessage({ type: 'system', text: 'AI 호출 실패 — ' + e.message });
        addMessage({ type: 'system', text: '이번 지시는 로컬 스마트 모드(무료)로 대신 답합니다.' });
        renderChatOnly(true);
        save();
      }
    }

    for (const a of targets) {
      draft.typingId = a.id;
      showTyping(a);
      renderStaff();
      const reply = smartReply(a, text);
      const wait = 340 + Math.min(760, reply.text.length * 5);
      await sleep(wait);
      hideTyping();
      addMessage({ type: 'assistant', senderId: a.id, text: reply.text, tag: '로컬' });
      state.tasks.unshift(makeTask(a, text));
      touchAssistant(a, summarize(reply.text, 60));
      renderChatOnly(true);
      renderTasks(); renderStaff(); renderTabs();
      await sleep(140);
    }
    draft.typingId = null;
    busy = false; $('#btnSend').disabled = false;
    save(); renderAll(); renderCost();
    if (ai.enabled && !useAI) {
      toast('⚡ 스마트 절약 모드 · 로컬 응답(무료) · 작업실에 ' + targets.length + '건 등록');
    } else {
      toast('📋 작업실에 ' + targets.length + '건 등록했습니다');
    }
  }

  async function respondOne(a, reply, wait) {
    draft.typingId = a.id;
    showTyping(a);
    renderStaff();
    await sleep(wait || 380);
    hideTyping();
    draft.typingId = null;
    addMessage({ type: 'assistant', senderId: a.id, text: reply.text, tag: reply.tag });
    touchAssistant(a, summarize(reply.text, 60));
    renderChatOnly(true);
    renderStaff(); renderTabs();
  }

  /* ───────── 토스트 ───────── */
  function toast(msg) {
    const wrap = $('#toastWrap');
    if (!wrap) return;
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; }, 2800);
    setTimeout(() => el.remove(), 3400);
  }

  /* ───────── 작업/메모 조작 ───────── */
  function taskAction(act, id) {
    const t = state.tasks.find((x) => x.id === id);
    if (!t) return;
    const a = assistantById(t.ownerId);
    if (act === 'start') { t.status = '진행중'; toast('▶ 진행중으로 바꿨습니다: ' + summarize(t.title, 20)); }
    if (act === 'done') {
      t.status = '완료'; t.doneAt = nowISO();
      if (a) {
        if (a.countDate !== today()) { a.countDate = today(); a.todayCount = 0; }
        a.lastReport = '「' + summarize(t.title, 24) + '」 완료 보고 · ' + timeLabel(t.doneAt);
      }
      toast('✅ 완료 처리했습니다');
    }
    if (act === 'reopen') { t.status = '대기'; t.doneAt = null; }
    if (act === 'del') {
      if (!confirm('이 작업을 삭제할까요?\n' + t.title)) return;
      state.tasks = state.tasks.filter((x) => x.id !== id);
      toast('작업을 삭제했습니다');
    }
    save(); renderAll();
    saveNow();
  }

  /* ───────── 파일 저장/불러오기 ───────── */
  function downloadFile(name, content, mime) {
    try {
      const blob = new Blob([content], { type: (mime || 'text/plain') + ';charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      toast('내려받았습니다: ' + name);
    } catch (e) {
      toast('파일 저장에 실패했습니다. 브라우저 다운로드 설정을 확인해 주세요.');
    }
  }

  function exportChat() {
    const lines = ['# ' + (state.profile.officeName || '마르스 비서실') + ' 대화 기록', '',
      '- 내보낸 시각: ' + new Date().toLocaleString('ko-KR'), ''];
    state.rooms.forEach((r) => {
      const list = state.messages[r.id] || [];
      if (!list.length) return;
      lines.push('## ' + r.emoji + ' ' + r.name, '');
      list.forEach((m) => {
        const who = m.senderId === 'owner'
          ? (state.profile.ownerName || '마르스') + ' (' + (state.profile.ownerTitle || '대장님') + ')'
          : ((assistantById(m.senderId) || {}).name || '비서') + ' 비서';
        lines.push('**' + who + '** · ' + dayLabel(m.at), '', m.text, '');
      });
    });
    downloadFile('마르스_비서실_대화_' + today() + '.md', lines.join('\n'), 'text/markdown');
  }

  function restoreFromFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let data = null;
      try { data = JSON.parse(String(reader.result || '')); }
      catch (e) { toast('⚠️ JSON 파일을 읽지 못했습니다. 백업 파일이 맞는지 확인해 주세요.'); return; }
      const obj = (data && data.state) ? data.state : data;
      const looksValid = obj && typeof obj === 'object' && !Array.isArray(obj) &&
        (obj.messages || obj.assistants || obj.tasks || obj.rooms);
      if (!looksValid) { toast('⚠️ 마르스 비서실 백업 파일이 아닙니다.'); return; }
      const ok = confirm('지금 이 기기의 대화·작업·메모를 백업 파일 내용으로 바꿉니다.\n계속할까요?');
      if (!ok) return;
      state = migrate(obj);
      saveNow();
      closeSettings();
      draft.memoQuery = '';
      renderAll();
      toast('✅ 백업을 불러왔습니다 (작업 ' + state.tasks.length + '건 · 메모 ' + state.memos.length + '건)');
    };
    reader.onerror = () => toast('⚠️ 파일을 읽지 못했습니다.');
    reader.readAsText(file, 'utf-8');
  }

      '<div class="sec"><p class="sec-title">💾 자료 (이 기기)</p>' +
      '<div class="row"><button class="btn mini" id="btnBackup">JSON 백업</button>' +
      '<label class="btn mini ghost" for="restoreFile" style="display:inline-flex;align-items:center;margin:0">JSON 불러오기</label>' +
      '<button class="btn mini danger" id="btnResetAll">전체 초기화</button></div>' +
      '<div class="hint" style="margin-top:6px">저장 상태: <b>' + (storeOK ? '이 기기 브라우저에 자동 저장' : '자동 저장 막힘 — JSON 백업 권장') +
      '</b> · 대화 ' + Object.keys(state.messages).reduce((n, k) => n + (state.messages[k] || []).length, 0) +
      '건 · 작업 ' + state.tasks.length + '건 · 메모 ' + state.memos.length + '건</div>' +
      '</div>' +

      /* 폰 사용법 */
      '<div class="sec"><p class="sec-title">📱 폰에서 쓰는 법</p>' +
      '<div class="howto"><ol>' +
      '<li><b>웹 주소</b>(lvybb1102-lgtm.github.io/mars-secretary)로 열었다면 <b>아래 5번(홈 화면에 추가)</b>만 하면 됩니다. 1~3번은 파일로 받아 쓸 때의 방법입니다.</li>' +
      '<li>이 HTML 파일을 폰 다운로드 폴더에 저장합니다(한 개로 끝).</li>' +
      '<li>크롬 주소창에 <b>file:///sdcard/Download/마르스_비서실_모바일.html</b> 처럼 직접 쳐서 열면 자동 저장이 가장 확실합니다.</li>' +
      '<li>다운로드 알림·파일 앱으로 열었을 때 상단이 <b>임시 저장</b>이면 이 브라우저에서는 저장이 막힌 것이라, 설정 → <b>JSON 백업</b>으로 보관하세요.</li>' +
      '<li>대화·작업·메모는 이 브라우저에 자동 저장됩니다. 기기를 바꾸기 전에 JSON 백업을 눌러 두세요.</li>' +
      '<li>홈 화면 아이콘은 파일 주소가 아니라 <b>웹 주소(HTTPS)</b>로 열 때만 추가할 수 있습니다.</li>' +
      '</ol></div></div>';
    bindSheet();
  }

  function bindSheet() {
    const s = draft.sheet;
    $$('#segMode button').forEach((b) => b.addEventListener('click', () => {
      s.mode = b.dataset.mode;
      $$('#segMode button').forEach((x) => x.classList.toggle('on', x === b));
    }));
    $$('#segCost button').forEach((b) => b.addEventListener('click', () => {
      s.showCost = b.dataset.cost === '1';
      $$('#segCost button').forEach((x) => x.classList.toggle('on', x === b));
    }));
    const modelEl = $('#setModel');
    if (modelEl) modelEl.addEventListener('change', () => { s.model = modelEl.value; });
    const test = $('#btnTestAI');
    if (test) test.addEventListener('click', () => testAI());
    const clear = $('#btnClearKey');
    if (clear) clear.addEventListener('click', () => {
      if (!confirm('저장된 Gemini API 키를 삭제할까요? (AI 응답이 꺼집니다)')) return;
      setKey('');
      renderSheet(); renderCost();
      toast('API 키를 삭제했습니다. 스마트 모드로 동작합니다.');
    });
    const bk = $('#btnBackup');
    if (bk) bk.addEventListener('click', backupJSON);
    const ur = $('#btnUsageReset2');
    if (ur) ur.addEventListener('click', () => {
      if (state.usage) delete state.usage[today()];
      s.lastUsage = '';
      save(); saveNow(); renderCost(); renderSheet();
      toast('오늘 사용량을 초기화했습니다.');
    });
    const reset = $('#btnResetAll');
    if (reset) reset.addEventListener('click', () => {
      if (!confirm('대화·작업·메모를 모두 지우고 처음 상태로 돌아갑니다.\n계속할까요?')) return;
      if (!confirm('마지막 확인입니다. 정말 초기화할까요?')) return;
      state = defaultState();
      state.meta.welcomed = true;
      saveNow(); closeSettings(); renderAll();
      toast('초기화했습니다.');
    });
  }

  async function testAI() {
    const s = draft.sheet;
    const keyEl = $('#setApiKey');
    const resEl = $('#testResult');
    if (!resEl) return;
    const typed = keyEl ? keyEl.value.trim() : '';
    resEl.className = 'status-line';
    resEl.textContent = '확인 중…';
    try {
      if (typed) { setKey(typed); if (keyEl) keyEl.value = ''; }
      if (!ai.apiKey) throw new Error('API 키를 먼저 입력해 주세요.');
      const j = await callGemini({
        prompt: '연결 확인. "연결 정상"이라고만 답하세요.',
        system: '짧게 답하세요.',
        model: s.model,
        json: false,
        timeoutMs: 45000
      });
      resEl.className = 'status-line ok';
      resEl.textContent = '✅ 연결 정상 · ' + j.model + ' · 약 ' + wonText(j.cost && j.cost.krw) + ' 사용';
      s.testResult = { ok: true, msg: resEl.textContent };
      s.lastUsage = new Date().toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' }) +
        ' · ' + j.model + ' · ' + wonText(j.cost && j.cost.krw);
      renderCost();
      save(); saveNow();
    } catch (e) {
      resEl.className = 'status-line err';
      resEl.textContent = '⚠️ ' + e.message;
      s.testResult = { ok: false, msg: resEl.textContent };
      renderCost();
    }
  }

  function saveSettings() {
    const s = draft.sheet;
    if (!s) { closeSettings(); return; }
    state.settings.responseMode = s.mode;
    state.settings.model = s.model;
    state.settings.showCost = s.showCost;
    $$('[data-staff-name]').forEach((el) => {
      const a = assistantById(el.dataset.staffName);
      if (!a) return;
      const name = el.value.trim();
      if (name) a.name = name;
      const title = $('[data-staff-title="' + a.id + '"]');
      if (title && title.value.trim()) a.title = title.value.trim();
      const role = $('[data-staff-role="' + a.id + '"]');
      if (role && role.value.trim()) {
        a.role = role.value.trim();
        a.aliases = [a.name, String(a.title || '').replace('비서', ''), a.role.split('·')[0].trim()].filter(Boolean);
      }
    });
    const keyEl = $('#setApiKey');
    if (keyEl && keyEl.value.trim()) setKey(keyEl.value.trim());
    saveNow();
    closeSettings();
    renderAll();
    toast('설정을 저장했습니다');
  }

  /* ───────── 이벤트 ───────── */
  function bind() {
    document.addEventListener('click', (ev) => {
      const tabBtn = ev.target.closest('.tab');
      if (tabBtn) {
        state.ui.tab = tabBtn.dataset.tab;
        save(); renderTabs();
        if (state.ui.tab === 'chat') renderChat(true);
        return;
      }
      const roomBtn = ev.target.closest('.room');
      if (roomBtn) {
        state.activeRoom = roomBtn.dataset.room;
        save(); renderRooms(); renderChat(true);
        return;
      }
      const sBtn = ev.target.closest('[data-sender]');
      if (sBtn) {
        state.ui.senderId = sBtn.dataset.sender;
        save(); renderComposer();
        return;
      }
      const mBtn = ev.target.closest('[data-mention]');
      if (mBtn) {
        const key = mBtn.dataset.mention;
        const inp = $('#input');
        inp.value = (inp.value.replace(/\s+$/, '') + ' @' + key + ' ').replace(/^\s+/, '');
        inp.focus();
        return;
      }
      const actBtn = ev.target.closest('[data-act]');
      if (actBtn) { taskAction(actBtn.dataset.act, actBtn.dataset.id); return; }
      const fBtn = ev.target.closest('.f-chip');
      if (fBtn) { state.ui.taskFilter = fBtn.dataset.filter; save(); renderTasks(); return; }
      const sStaff = ev.target.closest('[data-staff]');
      if (sStaff) {
        const id = sStaff.dataset.id;
        const act = sStaff.dataset.staff;
        if (act === 'edit') { draft.editId = id; renderStaff(); return; }
        if (act === 'cancel') { draft.editId = null; renderStaff(); return; }
        if (act === 'call') {
          state.ui.tab = 'chat';
          const a = assistantById(id);
          const inp = $('#input');
          inp.value = '@' + a.name + ' ';
          renderAll(); inp.focus();
          return;
        }
        if (act === 'save') {
          const a = assistantById(id);
          const name = $('[data-edit="name"][data-id="' + id + '"]').value.trim();
          const title = $('[data-edit="title"][data-id="' + id + '"]').value.trim();
          const role = $('[data-edit="role"][data-id="' + id + '"]').value.trim();
          if (name) a.name = name;
          if (title) a.title = title;
          if (role) {
            a.role = role;
            a.aliases = [a.name, String(a.title || '').replace('비서', ''), role.split('·')[0].trim()].filter(Boolean);
          }
          draft.editId = null;
          save(); saveNow(); renderAll(); toast('역할을 저장했습니다');
          return;
        }
      }
      const delMemo = ev.target.closest('[data-memo-del]');
      if (delMemo) {
        if (!confirm('이 메모를 삭제할까요?')) return;
        state.memos = state.memos.filter((m) => m.id !== delMemo.dataset.memoDel);
        save(); saveNow(); renderMemo(); toast('메모를 삭제했습니다');
        return;
      }
    });

    $('#btnSend').addEventListener('click', send);
    $('#input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
    });
    $('#input').addEventListener('input', (e) => {
      const el = e.target;
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 112) + 'px';
    });

    $('#btnNewTask').addEventListener('click', () => {
      $('#newTaskPanel').classList.toggle('hide');
      $('#newTaskOwner').innerHTML = state.assistants.map((a) =>
        '<option value="' + esc(a.id) + '">' + esc(a.emoji) + ' ' + esc(a.name) + ' · ' + esc(a.title) + '</option>').join('');
      $('#newTaskTitle').focus();
    });
    $('#btnCancelTask').addEventListener('click', () => $('#newTaskPanel').classList.add('hide'));
    $('#btnAddTask').addEventListener('click', addTask);
    $('#newTaskTitle').addEventListener('keydown', (e) => { if (e.key === 'Enter') addTask(); });

    $('#btnAddMemo').addEventListener('click', addMemo);
    $('#memoInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); addMemo(); }
    });
    $('#memoSearch').addEventListener('input', (e) => { draft.memoQuery = e.target.value; renderMemo(); });

    $('#btnSettings').addEventListener('click', openSettings);
    $('#storeBadge').addEventListener('click', openSettings);
    $('#btnCloseSettings').addEventListener('click', closeSettings);
    $('#settingsOverlay').addEventListener('click', (e) => { if (e.target.id === 'settingsOverlay') closeSettings(); });
    $('#btnSaveSettings').addEventListener('click', saveSettings);
    $('#btnExport').addEventListener('click', exportChat);
    $('#costChip').addEventListener('click', openSettings);
    $('#restoreFile').addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0];
      if (f) restoreFromFile(f);
      e.target.value = '';
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !$('#settingsOverlay').classList.contains('hide')) closeSettings();
    });

    const flush = () => { if (state) { try { saveNow(); } catch (err) { /* 무시 */ } } };
    window.addEventListener('pagehide', flush);
    window.addEventListener('beforeunload', flush);
    window.addEventListener('resize', () => {
      requestAnimationFrame(markOverflow);
      setPlaceholder();
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
  }

  function setPlaceholder() {
    const inp = $('#input');
    if (!inp) return;
    inp.placeholder = window.innerWidth <= 400
      ? '지시를 내려주세요 (@all)'
      : '대장님, 지시를 내려주세요 (@all 또는 @니케)';
  }

  /* ───────── 시작 ───────── */
  function init() {
    storeOK = probeStore();
    loadState();
    loadKey();
    renderAll();
    bind();
    renderStoreBadge();
    if (!storeOK) {
      setTimeout(() => toast('⚠️ 이 브라우저는 자동 저장이 막혀 있습니다. 설정 → JSON 백업으로 보관하세요.'), 1400);
    } else if (ai.enabled) {
      setTimeout(() => toast('🤖 AI 준비됨 (' + state.settings.model + ') · 절약 모드로 동작합니다'), 700);
    } else {
      setTimeout(() => toast('👑 스마트 모드로 시작합니다 · 설정에서 AI 키를 넣으면 실제 AI로 답합니다'), 900);
    }
    if (!state.meta.welcomed) { state.meta.welcomed = true; save(); }
    const inp = $('#input');
    setPlaceholder();
    if (inp && window.innerWidth > 900) inp.focus();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
<script>
/* GitHub Pages 배포판 전용 — 홈 화면 앱 설치·오프라인 백업 (앱 동작에는 영향 없음) */
(function () {
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
