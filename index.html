  /* ═══════════════ 첨부(사진·PDF·문서) ═══════════════ */
  const MAX_PDF_BYTES = 8 * 1024 * 1024;      // PDF 1건 8MB 이하(Gemini 인라인 한도 고려)
  const MAX_FILE_ITEMS = 6;                    // 한 번에 최대 6건
  const MAX_REF_IMAGES = 4;                    // 이미지 참조 최대 4장
  const IMG_MAX_SIDE = 1280;                   // 폰 사진 → 긴 변 1280px로 축소
  const IMG_QUALITY = 0.82;
  const THUMB_SIDE = 320;                      // 대화에 남기는 썸네일(용량 절약)
  const TEXT_MAX_DOC = 40000;                  // 문서 1건 프롬프트 최대 글자
  const TEXT_MAX_TOTAL = 80000;                // 문서 합계 상한

  const ATT_IMG_RE = /^image\//i;
  const ATT_TEXT_RE = /\.(txt|md|markdown|csv|tsv|json|log|html?|xml|ya?ml|ini|conf)$/i;

  function fileKindOf(f) {
    const name = String((f && f.name) || '');
    const type = String((f && f.type) || '');
    if (ATT_IMG_RE.test(type) || /\.(jpe?g|png|gif|webp|heic|heif|bmp)$/i.test(name)) return 'image';
    if (type === 'application/pdf' || /\.pdf$/i.test(name)) return 'pdf';
    if (ATT_TEXT_RE.test(name) || /^text\//i.test(type)) return 'text';
    return '';
  }

  function bytesText(n) {
    const b = Number(n) || 0;
    if (b >= 1024 * 1024) return (b / 1024 / 1024).toFixed(1) + 'MB';
    if (b >= 1024) return Math.round(b / 1024) + 'KB';
    return b + 'B';
  }

  function sizeText(x) {
    if (x.kind === 'text') return '문서 · ' + (x.chars || 0).toLocaleString('ko-KR') + '자';
    if (x.kind === 'image') return (x.w && x.h ? x.w + '×' + x.h + ' · ' : '사진 · ') + bytesText(x.size);
    return 'PDF · ' + bytesText(x.size);
  }

  function readAsDataURL(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result || ''));
      r.onerror = () => rej(new Error('파일을 읽지 못했습니다.'));
      r.readAsDataURL(file);
    });
  }
  function readAsText(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result || ''));
      r.onerror = () => rej(new Error('파일을 읽지 못했습니다.'));
      r.readAsText(file, 'utf-8');
    });
  }
  function loadImage(url) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => rej(new Error('사진을 해석하지 못했습니다.'));
      img.src = url;
    });
  }

  /* 폰 사진은 크다 → 캔버스로 긴 변 1280px JPEG로 줄인다(전송 용량·토큰·시간 절약) */
  async function shrinkImage(file, maxSide) {
    const full = await readAsDataURL(file);
    const img = await loadImage(full);
    let w = img.naturalWidth || img.width || 1;
    let h = img.naturalHeight || img.height || 1;
    const side = maxSide || IMG_MAX_SIDE;
    const scale = Math.min(1, side / Math.max(w, h));
    w = Math.max(1, Math.round(w * scale));
    h = Math.max(1, Math.round(h * scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    const dataURL = c.toDataURL('image/jpeg', IMG_QUALITY);
    return { mime: 'image/jpeg', data: dataURL.split(',')[1] || '', dataURL, w, h };
  }

  /* 대화에 남길 작은 썸네일(저장 용량 보호) */
  async function makeThumb(src) {
    try {
      const img = await loadImage(src);
      const w0 = img.naturalWidth || img.width || 1;
      const h0 = img.naturalHeight || img.height || 1;
      const scale = Math.min(1, THUMB_SIDE / Math.max(w0, h0));
      const w = Math.max(1, Math.round(w0 * scale));
      const h = Math.max(1, Math.round(h0 * scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      return { t: c.toDataURL('image/jpeg', 0.72), w: w0, h: h0 };
    } catch (e) {
      return { t: src, w: 0, h: 0 };
    }
  }

  async function addFiles(list) {
    const files = Array.prototype.slice.call(list || []);
    if (!files.length) return;
    for (const f of files) {
      if (attach.items.length >= MAX_FILE_ITEMS) { toast('첨부는 한 번에 ' + MAX_FILE_ITEMS + '건까지입니다.'); break; }
      const kind = fileKindOf(f);
      if (!kind) { toast('⚠️ ' + (f.name || '이 파일') + ' — 사진·PDF·문서(.txt .md .csv .json .log .html)만 보낼 수 있습니다.'); continue; }
      try {
        if (kind === 'image') {
          if (attach.items.filter((x) => x.kind === 'image').length >= MAX_REF_IMAGES) {
            toast('사진은 한 번에 ' + MAX_REF_IMAGES + '장까지입니다.'); continue;
          }
          const r = await shrinkImage(f);
          const th = await makeThumb(r.dataURL);
          attach.items.push({
            id: uid('f'), name: String(f.name || '사진') .slice(0, 60), mime: r.mime, kind: 'image',
            size: f.size || 0, data: r.data, th: th.t, w: r.w, h: r.h
          });
        } else if (kind === 'pdf') {
          if ((f.size || 0) > MAX_PDF_BYTES) {
            toast('⚠️ PDF는 8MB 이하만 됩니다. (이 파일 ' + bytesText(f.size) + ') 페이지를 나눠 저장하거나, 화면을 사진으로 찍어 보내 주세요.');
            continue;
          }
          const full = await readAsDataURL(f);
          attach.items.push({
            id: uid('f'), name: String(f.name || 'PDF'), mime: 'application/pdf', kind: 'pdf',
            size: f.size || 0, data: full.split(',')[1] || '', th: ''
          });
        } else {
          const text = await readAsText(f);
          const body = String(text || '').replace(/\u0000/g, '');
          if (!body.trim()) { toast('⚠️ ' + (f.name || '문서') + '이 비어 있습니다.'); continue; }
          attach.items.push({
            id: uid('f'), name: String(f.name || '문서').slice(0, 60), mime: 'text/plain', kind: 'text',
            size: f.size || 0, text: body, chars: body.length, th: ''
          });
        }
      } catch (e) {
        toast('⚠️ ' + (f.name || '파일') + ' — ' + (e.message || '읽지 못했습니다'));
      }
    }
    renderAttach();
    if (attach.items.length) toast('📎 ' + attach.items.length + '건 첨부 · 보내면 AI가 함께 읽습니다');
  }

  function renderAttach() {
    const row = $('#attachRow'), wrap = $('#attachChips');
    if (!row || !wrap) return;
    row.classList.toggle('hide', !attach.items.length);
    wrap.innerHTML = attach.items.map((x) =>
      '<div class="attach-chip"><div class="th">' +
      (x.th ? '<img src="' + esc(x.th) + '" alt="">' : (x.kind === 'pdf' ? '📄' : '📝')) + '</div>' +
      '<div class="nm"><b>' + esc(x.name) + '</b><span>' + esc(sizeText(x)) + '</span></div>' +
      '<button class="x" data-att-del="' + esc(x.id) + '" aria-label="첨부 삭제">✕</button></div>'
    ).join('');
    requestAnimationFrame(markOverflow);
    setPlaceholder();
  }

  function removeAttach(id) {
    attach.items = attach.items.filter((x) => x.id !== id);
    renderAttach();
  }
  function clearAttach() {
    attach.items = [];
    renderAttach();
    const el = $('#attachFile');
    if (el) el.value = '';
  }
  function btnAttachEl() { return $('#btnAttach'); }

  /* 대화에 남기는 정보만(원본 base64는 저장하지 않는다) */
  function attMetaOf(x) {
    return { name: x.name, kind: x.kind, mime: x.mime, size: x.size, th: x.th || '', w: x.w || 0, h: x.h || 0 };
  }

  /* AI 전송용 파트 */
  function attachmentParts(files) {
    return (files || []).filter((x) => x.data && (x.kind === 'image' || x.kind === 'pdf'))
      .map((x) => ({ mime: x.mime, data: x.data }));
  }
  function attachPromptNote(files) {
    const list = files || [];
    if (!list.length) return '';
    const n = { image: 0, pdf: 0, text: 0 };
    list.forEach((x) => { n[x.kind] = (n[x.kind] || 0) + 1; });
    const parts = [];
    if (n.image) parts.push('사진 ' + n.image + '장');
    if (n.pdf) parts.push('PDF ' + n.pdf + '건');
    if (n.text) parts.push('문서 ' + n.text + '건');
    return '\n\n[첨부] ' + parts.join(' · ') + '을 함께 보냈습니다. 첨부를 실제로 읽고 그 내용을 근거로 답하세요. 첨부에 없는 값은 지어내지 말고 "첨부에서 확인 안 됨"으로 남깁니다.';
  }
  function textAttachmentBlock(files) {
    const docs = (files || []).filter((x) => x.kind === 'text' && x.text);
    if (!docs.length) return '';
    let used = 0;
    const out = ['', '[첨부 문서 내용]'];
    for (const d of docs) {
      const room = TEXT_MAX_TOTAL - used;
      if (room <= 200) { out.push('… (첨부 문서 합계 상한 ' + TEXT_MAX_TOTAL.toLocaleString('ko-KR') + '자 초과로 이하 생략)'); break; }
      const body = String(d.text).slice(0, Math.min(TEXT_MAX_DOC, room));
      out.push('--- ' + d.name + ' (' + body.length.toLocaleString('ko-KR') + '자' +
        (body.length < String(d.text).length ? ' 중 앞부분' : '') + ') ---');
      out.push(body);
      out.push('');
      used += body.length;
    }
    return out.join('\n');
  }

  /* 이전 세션 원본 이미지(다운로드용) — IndexedDB, 실패하면 메모리만 */
  const IMG_DB = 'mars-secretary-img';
  const imgFull = Object.create(null);
  let idbOK = true;

  function idbOpen() {
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open(IMG_DB, 1);
        r.onupgradeneeded = () => {
          const db = r.result;
          if (!db.objectStoreNames.contains('img')) db.createObjectStore('img');
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error || new Error('IDB'));
      } catch (e) { rej(e); }
    });
  }
  async function idbPut(id, obj) {
    if (!idbOK || typeof indexedDB === 'undefined') return false;
    try {
      const db = await idbOpen();
      await new Promise((res, rej) => {
        const tx = db.transaction('img', 'readwrite');
        tx.objectStore('img').put(obj, id);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
      return true;
    } catch (e) { idbOK = false; return false; }
  }
  async function idbGet(id) {
    if (!idbOK || typeof indexedDB === 'undefined') return null;
    try {
      const db = await idbOpen();
      return await new Promise((res, rej) => {
        const tx = db.transaction('img', 'readonly');
        const rq = tx.objectStore('img').get(id);
        rq.onsuccess = () => res(rq.result || null);
        rq.onerror = () => rej(rq.error);
      });
    } catch (e) { return null; }
  }

  /* 이미지 모델이 바뀌어 없어진 경우 다음 후보로 */
  function imageModelOrder() {
    const first = normalizeModel(state.settings.imageModel || 'gemini-nano-banana-2.1');
    const list = [first].concat(IMAGE_FALLBACK.filter((m) => m !== first));
    return list.filter((m) => IMAGE_MODELS[m] || m === first);
  }

  function imgPriceUSD(model, size) {
    const spec = IMAGE_MODELS[model] || IMAGE_MODELS['gemini-nano-banana-2.1'];
    const sz = (spec.sizes || ['1K']).indexOf(size) >= 0 ? size : '1K';
    const base = (spec.perImg || {})[sz] || (spec.perImg || {})['1K'] || 0.0336;
    /* 생각(thinking) 토큰: 2.1 실측 761~1,667개 → 보수적으로 1,600개 가산 */
    const think = ((spec.thinkTok || 0) / 1e6) * ((IMAGE_PRICING[model] || {}).text || 7.5);
    return { usd: base + think, base };
  }
  function imgPriceWon(model, size) { return Math.round(imgPriceUSD(model, size).usd * USD_KRW); }

  function looksImageGen(text) {
    const t = String(text || '').replace(/@[^\s@,]+/g, '').trim();
    if (t.length < 5) return false;
    return IMG_INTENT.test(t);
  }
  function imageAuthor(text) {
    const raws = String(text || '').match(/@[^\s@,]+/g) || [];
    if (raws.length) {
      const t = parseTargets(text).filter((a) => a.id !== 'gpt');   // 이미지는 Gemini가 그린다
      if (t && t.length) return t[0];
      return assistantById('hongbo') || state.assistants[0];
    }
    return assistantById('hongbo') || state.assistants[0];
  }

  function buildImagePrompt(text, files) {
    const t = String(text || '').replace(/@[^\s@,]+/g, ' ').replace(/\s+/g, ' ').trim();
    const out = ['만들 이미지: ' + t];
    if ((files || []).some((x) => x.kind === 'image')) {
      out.push('첨부한 사진의 대상과 분위기를 유지하면서 요청대로 바꿔 주세요.');
    }
    const docs = (files || []).filter((x) => x.kind === 'text');
    if (docs.length) out.push('참고 문서: ' + docs.map((d) => String(d.text || '').slice(0, 1200)).join(' / '));
    out.push('고품질, 자연스러운 조명, 안정적인 구도. 이미지 안의 글자는 정확한 한글과 숫자만 쓰고, 깨진 글자·워터마크·서명은 넣지 않습니다.');
    return out.join('\n');
  }

  function friendlyImageError(status, body) {
    const err = (body && body.error) || {};
    const msg = String(err.message || (typeof body === 'string' ? body : '') || '').slice(0, 260);
    const st = err.status || String(status);
    if (/API_KEY_INVALID|API key not valid|invalid api key/i.test(msg)) {
      return 'API 키가 유효하지 않습니다. Google AI Studio에서 키를 다시 확인해 주세요.';
    }
    if (status === 429 || /prepay|credit|billing|payment|paid|free tier|RESOURCE_EXHAUSTED|quota|exhausted/i.test(msg)) {
      return '이미지 생성은 선불(유료) 결제된 키에서만 됩니다. AI Studio 결제 잔액·한도를 확인해 주세요. (무료 키는 이미지 생성이 막혀 있습니다)';
    }
    if (status === 403) return '이 키로는 이미지 생성이 막혀 있습니다(403). 무료 키 대신 선불 결제가 된 유료 키를 써 주세요.';
    if (status === 404 || /not found|NOT_FOUND|not supported/i.test(msg)) {
      return '이 모델을 쓸 수 없습니다(' + st + '). 설정에서 다른 이미지 모델을 골라 주세요.';
    }
    if (status === 400 && /safety|blocked|policy/i.test(msg)) return '요청이 안전 정책에 걸렸습니다. 표현을 바꿔 다시 시도해 주세요.';
    return '이미지 생성에 실패했습니다(' + st + '): ' + (msg || '알 수 없는 오류');
  }

  async function postImage(model, payload, timeoutMs) {
    const url = API_BASE + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(ai.apiKey);
    const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const limit = timeoutMs || 120000;
    const timer = ctrl ? setTimeout(() => { try { ctrl.abort(); } catch (e) { /* 무시 */ } }, limit) : null;
    let res;
    try {
      res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: ctrl ? ctrl.signal : undefined
      });
    } catch (e) {
      if (timer) clearTimeout(timer);
      if (e && e.name === 'AbortError') throw new Error('이미지 생성이 ' + Math.round(limit / 1000) + '초를 넘어 중단했습니다. 다시 시도해 주세요.');
      throw new Error('인터넷에 연결하지 못했습니다. Wi-Fi·모바일 데이터를 확인해 주세요.');
    }
    if (timer) clearTimeout(timer);
    const raw = await res.text();
    let body = null;
    try { body = JSON.parse(raw); } catch (e) { body = null; }
    if (!res.ok) {
      const err = new Error(friendlyImageError(res.status, body || raw));
      const m = String(((body && body.error) || {}).message || '');
      err.retryNext = res.status === 404 || (res.status === 400 && /model|not found|not supported/i.test(m));
      throw err;
    }
    return body || {};
  }

  function imageCostOf(model, um) {
    const p = IMAGE_PRICING[model] || IMAGE_PRICING['gemini-nano-banana-2.1'];
    const u = um || {};
    const pt = u.promptTokenCount || 0;
    const ct = u.candidatesTokenCount || 0;
    const th = u.thoughtsTokenCount || 0;
    const imgTok = (((u.candidatesTokensDetails || []).find((d) => d.modality === 'IMAGE')) || {}).tokenCount || 0;
    const textTok = Math.max(0, ct - imgTok);
    const usd = (pt / 1e6) * p.in + (imgTok / 1e6) * p.img + (textTok / 1e6) * p.text + (th / 1e6) * p.text;
    return { usd: Number(usd.toFixed(8)), krw: Number((usd * USD_KRW).toFixed(4)), imgTok, textTok, thinkTok: th };
  }

  function recordImageUsage(model, cost, pt, ct) {
    if (!state.usage) state.usage = {};
    const k = today();
    const d = Object.assign(emptyUsage(), state.usage[k] || {});
    d.calls += 1;
    d.promptTokens += (pt || 0);
    d.outputTokens += (ct || 0);
    d.usd = Number((d.usd + cost.usd).toFixed(8));
    d.krw = Number((d.krw + cost.krw).toFixed(4));
    state.usage[k] = d;
    const keys = Object.keys(state.usage).sort();
    while (keys.length > 40) { delete state.usage[keys.shift()]; }
    return cost;
  }

  async function generateImage(text, files) {
    if (!ai.apiKey) throw new Error('API 키가 없습니다. ⚙️ 설정에서 Google AI Studio 키를 먼저 저장해 주세요.');
    const refs = (files || []).filter((x) => x.kind === 'image' && x.data).slice(0, MAX_REF_IMAGES);
    const parts = [{ text: buildImagePrompt(text, files) }];
    refs.forEach((r) => parts.push({ inlineData: { mimeType: r.mime, data: r.data } }));

    const size = state.settings.imageSize || '1K';
    const aspect = state.settings.imageAspect || '1:1';
    const order = imageModelOrder();
    let lastErr = null;

    for (let i = 0; i < order.length; i++) {
      const model = order[i];
      const spec = IMAGE_MODELS[model] || {};
      const useSize = (spec.sizes || ['1K']).indexOf(size) >= 0 ? size : '1K';
      const imageConfig = { aspectRatio: aspect };
      if (useSize && model !== 'gemini-2.5-flash-image') imageConfig.imageSize = useSize;
      const payload = {
        contents: [{ role: 'user', parts }],
        generationConfig: { imageConfig }
      };
      try {
        const j = await postImage(model, payload);
        const block = j.promptFeedback && j.promptFeedback.blockReason;
        if (block) throw new Error('요청이 안전 정책에 걸렸습니다(' + block + '). 표현을 바꿔 다시 시도해 주세요.');
        const cand = (j.candidates || [])[0] || {};
        const cparts = (cand.content && cand.content.parts) || [];
        const imgPart = cparts.find((p) => p.inlineData && /^image\//.test(p.inlineData.mimeType || ''));
        if (!imgPart) {
          if (cand.finishReason === 'SAFETY' || cand.finishReason === 'PROHIBITED_CONTENT') {
            throw new Error('이 요청은 안전 정책상 이미지를 만들 수 없습니다. 표현이나 인물 묘사를 바꿔 주세요.');
          }
          throw new Error('이미지가 오지 않았습니다. 요청을 조금 더 구체적으로 적고 다시 시도해 주세요.');
        }
        const caption = cparts.filter((p) => p.text).map((p) => String(p.text)).join(' ').trim();
        const dataURL = 'data:' + imgPart.inlineData.mimeType + ';base64,' + imgPart.inlineData.data;
        const th = await makeThumb(dataURL);
        const um = j.usageMetadata || {};
        const cost = recordImageUsage(model, imageCostOf(model, um), um.promptTokenCount || 0, um.candidatesTokenCount || 0);
        if (i > 0) addMessage({ type: 'system', text: '앞 모델을 쓸 수 없어 「' + (spec.label || model) + '」로 대신 만들었습니다.' });
        return {
          model, size: useSize, aspect, cost,
          text: caption || '요청하신 이미지를 만들었습니다, 대장님.',
          img: {
            mime: imgPart.inlineData.mimeType, data: imgPart.inlineData.data,
            t: th.t, w: th.w, h: th.h, aspect, size: useSize,
            prompt: String(text || '').replace(/@[^\s@,]+/g, '').trim(),
            model
          }
        };
      } catch (e) {
        lastErr = e;
        if (e && e.retryNext && i < order.length - 1) continue;
        throw e;
      }
    }
    throw lastErr || new Error('이미지 생성에 실패했습니다.');
  }

  /* 대화 저장 용량 보호: 최근 30건만 썸네일 유지 */
  function pruneImages() {
    let seen = 0;
    Object.keys(state.messages || {}).forEach((k) => {
      const list = state.messages[k] || [];
      for (let i = list.length - 1; i >= 0; i--) {
        const m = list[i];
        const hasImg = (m.img && m.img.t) || (m.atts || []).some((x) => x.th);
        if (!hasImg) continue;
        seen += 1;
        if (seen <= 30) continue;
        if (m.img) { m.img.t = ''; }
        (m.atts || []).forEach((x) => { x.th = ''; });
      }
    });
  }

  function findMessage(id) {
    const rooms = Object.keys(state.messages || {});
    for (const k of rooms) {
      const hit = (state.messages[k] || []).find((m) => m.id === id);
      if (hit) return hit;
    }
    return null;
  }

  function b64ToBlob(b64, mime) {
    const bin = typeof atob === 'function' ? atob(b64) : '';
    const len = bin.length;
    const arr = new Uint8Array(len);
    for (let i = 0; i < len; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime || 'image/jpeg' });
  }

  async function imageSourceOf(id) {
    if (imgFull[id]) return imgFull[id];
    const fromDb = await idbGet(id);
    if (fromDb) { imgFull[id] = fromDb; return fromDb; }
    const msg = findMessage(id);
    if (msg && msg.img && msg.img.t) return { mime: 'image/jpeg', data: (msg.img.t.split(',')[1] || ''), thumbOnly: true };
    return null;
  }

  async function saveImage(id) {
    const src = await imageSourceOf(id);
    if (!src || !src.data) { toast('이미지 원본을 찾지 못했습니다. (이 기기 저장이 지워졌을 수 있습니다)'); return; }
    const msg = findMessage(id) || {};
    const ext = /\.png$|png/i.test(src.mime || '') ? 'png' : 'jpg';
    const d = new Date();
    const stamp = d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '_' + pad2(d.getHours()) + pad2(d.getMinutes());
    try {
      const blob = b64ToBlob(src.data, src.mime || 'image/jpeg');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '마르스_이미지_' + stamp + '.' + ext;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      toast(src.thumbOnly
        ? '미리보기 화질로 저장했습니다(원본은 이 세션에만 있습니다).'
        : '이미지를 저장했습니다' + (msg.img && msg.img.size ? ' (' + msg.img.size + ')' : ''));
    } catch (e) {
      toast('저장에 실패했습니다. 브라우저 다운로드 설정을 확인해 주세요.');
    }
  }

  function gdSave() {
    const nameEl = $('#gdName'), textEl = $('#gdText');
    if (!nameEl || !textEl) return;
    const text = cleanGuideText(textEl.value);
    if (!text) { toast('지침 내용을 적어주세요'); return; }
    const name = (nameEl.value || '').trim().slice(0, 60) || '지침 ' + ((state.guidelines || []).length + 1);
    const body = text.slice(0, GUIDE_MAX_DOC);
    const ed = draft.gd || {};
    if (ed.editId && ed.editId !== 'new') {
      const g = state.guidelines.find((x) => x.id === ed.editId);
      if (g) {
        g.name = name; g.text = body; g.updatedAt = nowISO();
        if (g.preset) g.source = '내장(수정)';
      }
      toast('지침 「' + name + '」을 저장했습니다');
    } else {
      state.guidelines.push({
        id: uid('g'), name, text: body, enabled: true, preset: false,
        source: '직접', createdAt: nowISO(), updatedAt: nowISO()
      });
      toast('지침 「' + name + '」을 추가했습니다 (' + body.length.toLocaleString('ko-KR') + '자)');

  function importGuideFile(file) {
    if (!file) return;
    const baseName = String(file.name || '불러온 지침').replace(/\.(md|txt|json|markdown)$/i, '')
      .replace(/^\d{4}-?\d{2}-?\d{2}[_-]?/, '').trim() || '불러온 지침';
    const reader = new FileReader();
    reader.onerror = () => toast('⚠️ 파일을 읽지 못했습니다.');
    reader.onload = () => {
      const raw = String(reader.result || '');
      let docs = [];
      if (/\.json$/i.test(file.name || '')) {
        let data = null;
        try { data = JSON.parse(raw); } catch (e) { toast('⚠️ JSON을 읽지 못했습니다.'); return; }
        const host = (data && data.state) ? data.state : data;
        let list = Array.isArray(host) ? host : (host && (host.guidelines || host.guides));
        if (!Array.isArray(list) && data && data.app === 'mars-secretary-mobile') {
          toast('⚠️ 이 JSON에는 지침이 없습니다. 통째로 복원하려면 설정 → JSON 불러오기를 쓰세요.');
          return;
        }
        if (!Array.isArray(list)) { toast('⚠️ JSON에서 지침 목록을 찾지 못했습니다.'); return; }
        docs = list.map((x, i) => guideFromAny(typeof x === 'string' ? { name: baseName + (i ? ' ' + (i + 1) : ''), text: x } : x, i)).filter(Boolean);
      } else {
        const text = cleanGuideText(raw);
        if (!text) { toast('⚠️ 파일이 비어 있습니다.'); return; }
        docs = [guideFromAny({ name: baseName, text, source: '파일' }, 0)];
      }
      if (!docs.length) { toast('⚠️ 넣을 지침이 없습니다.'); return; }
      let added = 0, updated = 0;
      docs.forEach((d) => {
        const same = (state.guidelines || []).find((g) => g.name === d.name);
        if (same) {
          same.text = d.text; same.enabled = true; same.updatedAt = nowISO(); same.source = d.source;
          updated += 1;
        } else {
          state.guidelines.push(Object.assign({}, d, { id: uid('g'), enabled: true }));
          added += 1;
        }
      });
      draft.gd = null;
      save(); saveNow(); refreshGuideUI();
      toast('지침 ' + (added ? added + '건 추가' : '') + (updated ? (added ? ' · ' : '') + updated + '건 갱신' : '') +
        ' (' + guidesChars(docs).toLocaleString('ko-KR') + '자)');
    };
    reader.readAsText(file, 'utf-8');
  }

      '<div class="hint">회의실 상단에 오늘 AI 호출 횟수와 예상 비용을 보여줍니다.</div></div></div>' +

      /* 자료 */
      '<div class="sec"><p class="sec-title">💾 자료 (이 기기)</p>' +
      '<div class="row"><button class="btn mini" id="btnBackup">JSON 백업</button>' +
      '<label class="btn mini ghost" for="restoreFile" style="display:inline-flex;align-items:center;margin:0">JSON 불러오기</label>' +
      '<button class="btn mini danger" id="btnResetAll">전체 초기화</button></div>' +
      '<div class="hint" style="margin-top:6px">저장 상태: <b>' + (storeOK ? '이 기기 브라우저에 자동 저장' : '자동 저장 막힘 — JSON 백업 권장') +
      '</b> · 대화 ' + Object.keys(state.messages).reduce((n, k) => n + (state.messages[k] || []).length, 0) +
      '건 · 작업 ' + state.tasks.length + '건 · 메모 ' + state.memos.length + '건 · 지침 ' + (state.guidelines || []).length + '건</div>' +
      '<div class="hint">JSON 백업에는 <b>지침도 함께</b> 담깁니다(Google·OpenAI API 키는 담기지 않음).</div>' +
      '</div>' +

      /* 폰 사용법 */
      '<div class="sec"><p class="sec-title">📱 폰에서 쓰는 법</p>' +
      '<div class="howto"><ol>' +
      '<li><b>웹 주소</b>(lvybb1102-lgtm.github.io/mars-secretary)로 열었다면 <b>아래 5번(홈 화면에 추가)</b>만 하면 됩니다. 1~3번은 파일로 받아 쓸 때의 방법입니다.</li>' +
      '<li>이 HTML 파일을 폰 다운로드 폴더에 저장합니다(한 개로 끝).</li>' +
      '<li>크롬 주소창에 <b>file:///sdcard/Download/마르스_비서실_모바일.html</b> 처럼 직접 쳐서 열면 자동 저장이 가장 확실합니다.</li>' +
      '<li>다운로드 알림·파일 앱으로 열었을 때 상단이 <b>임시 저장</b>이면 이 브라우저에서는 저장이 막힌 것이라, 설정 → <b>JSON 백업</b>으로 보관하세요.</li>' +
      '<li>대화·작업·메모는 이 브라우저에 자동 저장됩니다. 기기를 바꾸기 전에 JSON 백업을 눌러 두세요.</li>' +
      '<li>홈 화면 아이콘은 파일 주소가 아니라 <b>웹 주소(HTTPS)</b>로 열 때만 추가할 수 있습니다.</li>' +
      '</ol></div></div>';
    bindSheet();
  }

  function bindSheet() {
    const s = draft.sheet;
    $$('#segMode button').forEach((b) => b.addEventListener('click', () => {
      s.mode = b.dataset.mode;
      $$('#segMode button').forEach((x) => x.classList.toggle('on', x === b));
    }));
    $$('#segCost button').forEach((b) => b.addEventListener('click', () => {
      s.showCost = b.dataset.cost === '1';
      $$('#segCost button').forEach((x) => x.classList.toggle('on', x === b));
    }));
    const modelEl = $('#setModel');
    if (modelEl) modelEl.addEventListener('change', () => { s.model = modelEl.value; });
    const imgModelEl = $('#setImgModel');
    if (imgModelEl) imgModelEl.addEventListener('change', () => {
      s.imageModel = imgModelEl.value;
      const spec = IMAGE_MODELS[s.imageModel] || {};
      if ((spec.sizes || ['1K']).indexOf(s.imageSize) < 0) s.imageSize = (spec.sizes || ['1K'])[0];
      refreshImgUI();
    });
    const test = $('#btnTestAI');
    if (test) test.addEventListener('click', () => testAI());
    const clear = $('#btnClearKey');
    if (clear) clear.addEventListener('click', () => {
      if (!confirm('저장된 Gemini API 키를 삭제할까요? (AI 응답이 꺼집니다)')) return;
      setKey('');
      renderSheet(); renderCost();
      toast('API 키를 삭제했습니다. 스마트 모드로 동작합니다.');
    });
    const omEl = $('#setOpenaiModel');
    if (omEl) omEl.addEventListener('change', () => {
      s.openaiModel = normalizeOpenAIModel(omEl.value);
      const keys = Object.keys(OPENAI_MODELS);
      $$('.gpt-row').forEach((row, i) => row.classList.toggle('on', keys[i] === s.openaiModel));
    });
    const testOa = $('#btnTestOpenAI');
    if (testOa) testOa.addEventListener('click', () => testOpenAI());
    const clearOa = $('#btnClearOpenaiKey');
    if (clearOa) clearOa.addEventListener('click', () => {
      if (!confirm('저장된 OpenAI API 키를 삭제할까요? (@지피티가 GPT 대신 로컬 응답으로 바뀝니다)')) return;
      setOpenaiKey('');
      renderSheet(); renderCost();
      toast('OpenAI 키를 삭제했습니다.');
    });
    const bk = $('#btnBackup');
    if (bk) bk.addEventListener('click', backupJSON);
    const ur = $('#btnUsageReset2');
    if (ur) ur.addEventListener('click', () => {
      if (state.usage) delete state.usage[today()];
      s.lastUsage = '';
      save(); saveNow(); renderCost(); renderSheet();
      toast('오늘 사용량을 초기화했습니다.');
    });
    const reset = $('#btnResetAll');
    if (reset) reset.addEventListener('click', () => {
      if (!confirm('대화·작업·메모를 모두 지우고 처음 상태로 돌아갑니다.\n계속할까요?')) return;
      if (!confirm('마지막 확인입니다. 정말 초기화할까요?')) return;
      state = defaultState();
      state.meta.welcomed = true;
      saveNow(); closeSettings(); renderAll();
      toast('초기화했습니다.');
    });
  }

  async function testAI() {
    const s = draft.sheet;
    const keyEl = $('#setApiKey');
    const resEl = $('#testResult');
    if (!resEl) return;
    const typed = keyEl ? keyEl.value.trim() : '';
    resEl.className = 'status-line';
    resEl.textContent = '확인 중…';
    try {
      if (typed) { setKey(typed); if (keyEl) keyEl.value = ''; }
      if (!ai.apiKey) throw new Error('API 키를 먼저 입력해 주세요.');
      const j = await callGemini({
        prompt: '연결 확인. "연결 정상"이라고만 답하세요.',
        system: '짧게 답하세요.',
        model: s.model,
        json: false,
        timeoutMs: 45000
      });
      resEl.className = 'status-line ok';
      resEl.textContent = '✅ 연결 정상 · ' + j.model + ' · 약 ' + wonText(j.cost && j.cost.krw) + ' 사용';
      s.testResult = { ok: true, msg: resEl.textContent };
      s.lastUsage = new Date().toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' }) +
        ' · ' + j.model + ' · ' + wonText(j.cost && j.cost.krw);
      renderCost();
      save(); saveNow();
    } catch (e) {
      resEl.className = 'status-line err';
      resEl.textContent = '⚠️ ' + e.message;
      s.testResult = { ok: false, msg: resEl.textContent };
      renderCost();
    }
  }

  async function testOpenAI() {
    const s = draft.sheet;
    const keyEl = $('#setOpenaiKey');
    const resEl = $('#openaiTestResult');
    if (!resEl || !s) return;
    const typed = keyEl ? keyEl.value.trim() : '';
    resEl.className = 'status-line';
    resEl.textContent = '확인 중…';
    try {
      if (typed) { setOpenaiKey(typed); if (keyEl) keyEl.value = ''; }
      if (!ai.openaiKey) throw new Error('OpenAI API 키를 먼저 입력해 주세요.');
      const j = await callOpenAI({
        system: '짧게 답하세요.',
        prompt: '연결 확인. "연결 정상"이라고만 답하세요.',
        model: s.openaiModel,
        maxTokens: 60,
        timeoutMs: 60000
      });
      resEl.className = 'status-line ok';
      resEl.textContent = '✅ 연결 정상 · ' + j.model + ' · 약 ' + wonText(j.cost && j.cost.krw) + ' 사용';
      s.openaiTestResult = { ok: true, msg: resEl.textContent };
      s.lastUsage = new Date().toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' }) +
        ' · ' + j.model + ' · ' + wonText(j.cost && j.cost.krw);
      renderCost();
      save(); saveNow();
    } catch (e) {
      resEl.className = 'status-line err';
      resEl.textContent = '⚠️ ' + e.message;
      s.openaiTestResult = { ok: false, msg: resEl.textContent };
      renderCost();
    }
  }

  function saveSettings() {
    const s = draft.sheet;
    if (!s) { closeSettings(); return; }
    state.settings.responseMode = s.mode;
    state.settings.model = s.model;
    state.settings.showCost = s.showCost;
    state.settings.openaiModel = Object.prototype.hasOwnProperty.call(OPENAI_MODELS, s.openaiModel)
      ? s.openaiModel : OPENAI_DEFAULT_MODEL;
    state.settings.imageModel = Object.prototype.hasOwnProperty.call(IMAGE_MODELS, s.imageModel)
      ? s.imageModel : 'gemini-nano-banana-2.1';
    const spec = IMAGE_MODELS[state.settings.imageModel] || {};
    state.settings.imageSize = (spec.sizes || ['1K']).indexOf(s.imageSize) >= 0 ? s.imageSize : '1K';
    state.settings.imageAspect = IMAGE_ASPECTS.indexOf(s.imageAspect) >= 0 ? s.imageAspect : '1:1';
    $$('[data-staff-name]').forEach((el) => {
      const a = assistantById(el.dataset.staffName);
      if (!a) return;
      const name = el.value.trim();
      if (name) a.name = name;
      const title = $('[data-staff-title="' + a.id + '"]');
      if (title && title.value.trim()) a.title = title.value.trim();
      const role = $('[data-staff-role="' + a.id + '"]');
      if (role && role.value.trim()) {
        a.role = role.value.trim();
        a.aliases = [a.name, String(a.title || '').replace('비서', ''), a.role.split('·')[0].trim()].filter(Boolean);
      }
    });
    const keyEl = $('#setApiKey');
    if (keyEl && keyEl.value.trim()) setKey(keyEl.value.trim());
    const oaKeyEl = $('#setOpenaiKey');
    if (oaKeyEl && oaKeyEl.value.trim()) setOpenaiKey(oaKeyEl.value.trim());
    saveNow();
    closeSettings();
    renderAll();
    renderRatioChips();
    if (attach.items.length) renderAttach();
    toast('설정을 저장했습니다');
  }

  /* ───────── 이벤트 ───────── */
  function bind() {
    document.addEventListener('click', (ev) => {
      const tabBtn = ev.target.closest('.tab');
      if (tabBtn) {
        state.ui.tab = tabBtn.dataset.tab;
        save(); renderTabs();
        if (state.ui.tab === 'chat') renderChat(true);
        return;
      }
      const iSz = ev.target.closest('[data-isize]');
      if (iSz && draft.sheet) {
        draft.sheet.imageSize = iSz.dataset.isize;
        refreshImgUI();
        return;
      }
      const iAsp = ev.target.closest('[data-iaspect]');
      if (iAsp && draft.sheet) {
        draft.sheet.imageAspect = iAsp.dataset.iaspect;
        refreshImgUI();
        return;
      }
      const attDel = ev.target.closest('[data-att-del]');
      if (attDel) { removeAttach(attDel.dataset.attDel); return; }
      const ratioBtn = ev.target.closest('[data-ratio]');
      if (ratioBtn) {
        state.settings.imageAspect = ratioBtn.dataset.ratio;
        save(); renderRatioChips();
        return;
      }
      const imgSave = ev.target.closest('[data-img-save]');
      if (imgSave) { saveImage(imgSave.dataset.imgSave); return; }
      const imgOpen = ev.target.closest('[data-img-open]');
      if (imgOpen) { openLightbox(imgOpen.dataset.imgOpen); return; }
      const imgRetry = ev.target.closest('[data-img-retry]');
      if (imgRetry) { retryImage(imgRetry.dataset.imgRetry); return; }
      const roomBtn = ev.target.closest('.room');
      if (roomBtn) {
        setRoom(roomBtn.dataset.room);
        return;
      }
      const mapBtn = ev.target.closest('[data-map-room]');
      if (mapBtn) {
        setRoom(mapBtn.dataset.mapRoom);
        return;
      }
      if (ev.target.closest('#btnMapToggle')) {
        toggleMap();
        return;
      }
      const sBtn = ev.target.closest('[data-sender]');
      if (sBtn) {
        state.ui.senderId = sBtn.dataset.sender;
        save(); renderComposer();
        return;
      }
      const mBtn = ev.target.closest('[data-mention]');
      if (mBtn) {
        const key = mBtn.dataset.mention;
        const inp = $('#input');
        inp.value = (inp.value.replace(/\s+$/, '') + ' @' + key + ' ').replace(/^\s+/, '');
        inp.focus();
        return;
      }
      const actBtn = ev.target.closest('[data-act]');
      if (actBtn) { taskAction(actBtn.dataset.act, actBtn.dataset.id); return; }
      const fBtn = ev.target.closest('.f-chip');
      if (fBtn) { state.ui.taskFilter = fBtn.dataset.filter; save(); renderTasks(); return; }
      const sStaff = ev.target.closest('[data-staff]');
      if (sStaff) {
        const id = sStaff.dataset.id;
        const act = sStaff.dataset.staff;
        if (act === 'edit') { draft.editId = id; renderStaff(); return; }
        if (act === 'cancel') { draft.editId = null; renderStaff(); return; }
        if (act === 'call') {
          state.ui.tab = 'chat';
          const a = assistantById(id);
          const inp = $('#input');
          inp.value = '@' + a.name + ' ';
          renderAll(); inp.focus();
          return;
        }
        if (act === 'save') {
          const a = assistantById(id);
          const name = $('[data-edit="name"][data-id="' + id + '"]').value.trim();
          const title = $('[data-edit="title"][data-id="' + id + '"]').value.trim();
          const role = $('[data-edit="role"][data-id="' + id + '"]').value.trim();
          if (name) a.name = name;
          if (title) a.title = title;
          if (role) {
            a.role = role;
            a.aliases = [a.name, String(a.title || '').replace('비서', ''), role.split('·')[0].trim()].filter(Boolean);
          }
          draft.editId = null;
          save(); saveNow(); renderAll(); toast('역할을 저장했습니다');
          return;
        }
      }
      const delMemo = ev.target.closest('[data-memo-del]');
      if (delMemo) {
        if (!confirm('이 메모를 삭제할까요?')) return;
        state.memos = state.memos.filter((m) => m.id !== delMemo.dataset.memoDel);
        save(); saveNow(); renderMemo(); toast('메모를 삭제했습니다');
        return;
      }
      const gdBtn = ev.target.closest('[data-gd]');
      if (gdBtn) {
        const act = gdBtn.dataset.gd;
        if (act === 'save') { gdSave(); return; }
        if (act === 'cancel') { draft.gd = null; refreshGuideUI(); return; }
        if (act === 'new') { draft.gd = { editId: 'new', name: '', text: '' }; refreshGuideUI();
          const ta = $('#gdText'); if (ta) { ta.focus(); ta.scrollIntoView({ block: 'center' }); } return; }
        if (act === 'export') { gdExport(); return; }
        if (act === 'preset') { gdRestorePreset(); return; }
        if (act === 'tg') { gdToggle(gdBtn.dataset.id); return; }
        if (act === 'edit') {
          const g = (state.guidelines || []).find((x) => x.id === gdBtn.dataset.id);
          if (g) { draft.gd = { editId: g.id, name: g.name, text: g.text }; refreshGuideUI();
            const ta = $('#gdText'); if (ta) { ta.focus(); ta.scrollIntoView({ block: 'center' }); } }
          return;
        }
        if (act === 'del') { gdDelete(gdBtn.dataset.id); return; }
      }
    });

    document.addEventListener('change', (ev) => {
      if (ev.target && ev.target.id === 'guideFile') {
        const f = ev.target.files && ev.target.files[0];
        if (f) importGuideFile(f);
        ev.target.value = '';
      }
    });

    $('#btnSend').addEventListener('click', send);
    const btnAtt = $('#btnAttach');
    if (btnAtt) btnAtt.addEventListener('click', () => { const el = $('#attachFile'); if (el) el.click(); });
    const btnGen = $('#btnImgMode');
    if (btnGen) btnGen.addEventListener('click', () => setGenMode(!attach.mode));
    const attFile = $('#attachFile');
    if (attFile) attFile.addEventListener('change', (e) => {
      const list = Array.prototype.slice.call((e.target.files || []));
      if (list.length) addFiles(list);
      e.target.value = '';
    });
    const lbc1 = $('#btnLbClose');
    if (lbc1) lbc1.addEventListener('click', closeLightbox);
    const lbc2 = $('#btnLbClose2');
    if (lbc2) lbc2.addEventListener('click', closeLightbox);
    const lbSave = $('#btnLbSave');
    if (lbSave) lbSave.addEventListener('click', () => { if (draft.lbId) saveImage(draft.lbId); });
    const lb = $('#lightbox');
    if (lb) lb.addEventListener('click', (e) => { if (e.target.id === 'lightbox') closeLightbox(); });
    $('#input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
    });
    $('#input').addEventListener('input', (e) => {
      const el = e.target;
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 112) + 'px';
    });

    $('#btnNewTask').addEventListener('click', () => {
      $('#newTaskPanel').classList.toggle('hide');
      $('#newTaskOwner').innerHTML = state.assistants.map((a) =>
        '<option value="' + esc(a.id) + '">' + esc(a.emoji) + ' ' + esc(a.name) + ' · ' + esc(a.title) + '</option>').join('');
      $('#newTaskTitle').focus();
    });
    $('#btnCancelTask').addEventListener('click', () => $('#newTaskPanel').classList.add('hide'));
    $('#btnAddTask').addEventListener('click', addTask);
    $('#newTaskTitle').addEventListener('keydown', (e) => { if (e.key === 'Enter') addTask(); });

    $('#btnAddMemo').addEventListener('click', addMemo);
    $('#memoInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); addMemo(); }
    });
    $('#memoSearch').addEventListener('input', (e) => { draft.memoQuery = e.target.value; renderMemo(); });

    $('#btnSettings').addEventListener('click', openSettings);
    $('#storeBadge').addEventListener('click', openSettings);
    $('#btnCloseSettings').addEventListener('click', closeSettings);
    $('#settingsOverlay').addEventListener('click', (e) => { if (e.target.id === 'settingsOverlay') closeSettings(); });
    $('#btnSaveSettings').addEventListener('click', saveSettings);
    $('#btnExport').addEventListener('click', exportChat);
    $('#costChip').addEventListener('click', openSettings);
    $('#restoreFile').addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0];
      if (f) restoreFromFile(f);
      e.target.value = '';
    });

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      const lb = $('#lightbox');
      if (lb && !lb.classList.contains('hide')) { closeLightbox(); return; }
      if (!$('#settingsOverlay').classList.contains('hide')) closeSettings();
    });

    const flush = () => { if (state) { try { saveNow(); } catch (err) { /* 무시 */ } } };
    window.addEventListener('pagehide', flush);
    window.addEventListener('beforeunload', flush);
    window.addEventListener('resize', () => {
      requestAnimationFrame(markOverflow);
      setPlaceholder();
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
  }

  function setPlaceholder() {
    const inp = $('#input');
    if (!inp) return;
    if (attach.mode) {
      inp.placeholder = '🎨 만들 이미지를 설명해 주세요';
      return;
    }
    if (attach.items.length) {
      const n = attach.items.length;
      inp.placeholder = (window.innerWidth <= 400 ? '📎 ' + n + '건 · ' : '📎 첨부 ' + n + '건 · ') + '물어보세요';
      return;
    }
    inp.placeholder = window.innerWidth <= 480
      ? '지시를 내려주세요 (@all)'
      : '대장님, 지시를 내려주세요 (@all 또는 @니케)';
  }

  /* ───────── 시작 ───────── */
  function init() {
    storeOK = probeStore();
    loadState();
    loadKey();
    loadOpenaiKey();
    renderAll();
    bind();
    renderStoreBadge();
    if (!storeOK) {
      setTimeout(() => toast('⚠️ 이 브라우저는 자동 저장이 막혀 있습니다. 설정 → JSON 백업으로 보관하세요.'), 1400);
    } else if (ai.enabled || ai.openaiEnabled) {
      const parts = [];
      if (ai.enabled) parts.push(state.settings.model);
      if (ai.openaiEnabled) parts.push('지피티 ' + normalizeOpenAIModel(state.settings.openaiModel));
      setTimeout(() => toast('🤖 AI 준비됨 (' + parts.join(' · ') + ')'), 700);
    } else {
      setTimeout(() => toast('👑 스마트 모드로 시작합니다 · 설정에서 AI 키를 넣으면 실제 AI로 답합니다'), 900);
    }
    if (!state.meta.welcomed) { state.meta.welcomed = true; save(); }
    const inp = $('#input');
    setPlaceholder();
    if (inp && window.innerWidth > 900) inp.focus();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
<script>
/* GitHub Pages 배포판 전용 — 홈 화면 앱 설치·오프라인 백업 (앱 동작에는 영향 없음) */
(function () {
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
