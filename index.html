<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F3EB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="마르스 비서실">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="마르스 님 전용 AI 비서실 — 스마트폰 브라우저에서 단독 실행되는 단일 HTML 앱">
<title>마르스 비서실</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
/* ============================================================
   마르스 비서실 — 모바일 단독판 스타일
   크림/베이지 톤 · 폰 우선(100dvh) · PC에서는 카드 형태로 중앙 정렬
   ============================================================ */
:root{
  --bg:#F7F3EB;
  --card:#FFFDF9;
  --cream:#FFFCF5;
  --line:#EFE4D3;
  --line-2:#E7DAC6;
  --ink:#3B2A1C;
  --ink-2:#6B5644;
  --ink-3:#9C8674;
  --brown:#7A4A22;
  --brown-d:#5E3616;
  --peach:#FBE3D5;
  --peach-line:#F5CDBB;
  --mint:#2E9E5B;
  --mint-bg:#EAF7EE;
  --amber:#B4720E;
  --amber-bg:#FFF4DC;
  --green:#2E8B57;
  --green-bg:#E9F6EE;
  --shadow:0 24px 60px rgba(120,90,50,.16);
  --safe-b:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;height:100%;padding:18px;
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(1200px 620px at 50% -12%, #FFF7E8 0%, rgba(255,247,232,0) 62%),
    radial-gradient(900px 500px at 100% 100%, #F2E7D6 0%, rgba(242,231,214,0) 55%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
.hide{display:none !important}

/* ───────── 앱 카드 ───────── */
.app{
  width:min(560px,100%);
  height:min(920px,calc(100vh - 36px));
  height:min(920px,calc(100dvh - 36px));
  display:flex;flex-direction:column;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:26px;
  box-shadow:var(--shadow),0 1px 0 #fff inset;
  overflow:hidden;position:relative;
}

/* ───────── 헤더 ───────── */
.hdr{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 11px;
  background:linear-gradient(180deg,#FFFDF9 0%,#FFFBF2 100%);
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.crest{
  width:42px;height:42px;flex:0 0 auto;display:grid;place-items:center;
  font-size:20px;border-radius:13px;
  background:linear-gradient(160deg,#FFF6D2 0%,#F8DE93 55%,#EFCB6E 100%);
  border:1px solid #E8CE8B;
  box-shadow:0 4px 10px rgba(200,160,80,.28),0 1px 0 #fff inset;
}
.brand-txt{min-width:0}
.brand h1{
  margin:0;font-size:17px;font-weight:800;letter-spacing:-.4px;
  color:#3A2A1B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sub{margin:2px 0 0;display:flex;align-items:center;gap:5px;font-size:11px;color:#7C6653;font-weight:600}
.sub .dot{width:6px;height:6px;border-radius:50%;background:#3FB268;box-shadow:0 0 0 2.5px rgba(63,178,104,.18)}
.hdr-right{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.live{
  display:flex;align-items:center;gap:5px;
  padding:5px 9px;border-radius:999px;
  background:var(--mint-bg);border:1px solid #CDEBD8;color:#2C8C55;
  font-size:10.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;
}
.live i{width:6px;height:6px;border-radius:50%;background:#35BF6A;box-shadow:0 0 0 0 rgba(53,191,106,.6);animation:pulse 2.4s infinite}
.live.off{background:#FFF3E2;border-color:#F3DCBB;color:#A9711B}
.live.off i{background:#D89A38;animation:none}
.live .short{display:none}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(53,191,106,.55)}
  70%{box-shadow:0 0 0 6px rgba(53,191,106,0)}
  100%{box-shadow:0 0 0 0 rgba(53,191,106,0)}
}
.gear{
  width:36px;height:36px;border-radius:11px;border:1px solid var(--line-2);
  background:#FFFCF4;font-size:15px;display:grid;place-items:center;
  transition:transform .15s,background .15s;
}
.gear:active{background:#FFF6E4;transform:scale(.96)}

/* ───────── 탭 ───────── */
.tabs{
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  padding:8px 9px;background:var(--cream);
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
.tab{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:50px;padding:6px 2px 7px;border:0;border-radius:14px;background:transparent;
  color:#7B6653;font-size:11px;font-weight:700;letter-spacing:-.3px;
  transition:background .18s,color .18s,box-shadow .18s,transform .12s;
}
.tab .ticon{font-size:16px;line-height:1;transition:filter .18s}
.tab:active{transform:scale(.97)}
.tab.active{
  background:linear-gradient(180deg,#8D5C2C 0%,#6A3F1C 100%);
  color:#fff;box-shadow:0 8px 18px rgba(107,66,28,.30),0 1px 0 rgba(255,255,255,.28) inset;
}
.tab.active .ticon{filter:saturate(1.15) brightness(1.05)}
.tab-badge{
  position:absolute;top:3px;right:calc(50% - 23px);
  min-width:16px;height:16px;padding:0 4px;border-radius:9px;
  background:#D2694A;color:#fff;font-size:9.5px;font-weight:800;
  display:grid;place-items:center;
}

/* ───────── 본문 ───────── */
.body{flex:1 1 auto;min-height:0;position:relative;background:var(--card)}
.view{display:none;flex-direction:column;height:100%;min-height:0}
.view.active{display:flex}

/* ───────── 회의실 ───────── */
.rooms{display:flex;gap:6px;padding:10px 12px 6px;overflow-x:auto;flex:0 0 auto;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.room{
  flex:0 0 auto;display:flex;align-items:center;gap:5px;
  min-height:36px;padding:7px 13px;border-radius:999px;
  border:1px solid var(--line-2);background:linear-gradient(180deg,#FFFDF9,#FFF8EC);
  color:#6B5644;font-size:12px;font-weight:700;letter-spacing:-.3px;transition:.16s;
  box-shadow:0 2px 6px rgba(150,110,64,.09),0 1px 0 #fff inset;
}
.room.active{background:linear-gradient(180deg,#FFFDFA,#FDF3E5);border-color:#E3B79C;color:#4A3123;box-shadow:0 4px 12px rgba(196,146,118,.28),0 0 0 2px rgba(251,227,213,.55),0 1px 0 #fff inset}

/* ───────── 🗺️ 오피스 맵 (클레이 3D) ───────── */
.omap{
  flex:0 0 auto;margin:9px 10px 0;padding:9px 10px 8px;
  background:linear-gradient(180deg,#FFFDF9 0%,#FCF5E9 100%);
  border:1px solid #EDDFC9;border-radius:20px;
  box-shadow:0 10px 26px rgba(146,110,66,.12),0 1px 0 #fff inset;
}
.omap-head{display:flex;align-items:flex-start;gap:8px;min-width:0}
.omap-ico{
  width:27px;height:27px;flex:0 0 auto;display:grid;place-items:center;font-size:14px;
  border-radius:9px;background:linear-gradient(160deg,#FFF4DA 0%,#F4DFB3 100%);
  border:1px solid #EAD2A4;box-shadow:0 2px 5px rgba(190,150,90,.22),0 1px 0 #fff inset;
}
.omap-tt{flex:1 1 auto;min-width:0}
.omap-tt b{display:block;font-size:12.5px;font-weight:900;color:#4A3123;letter-spacing:-.5px;line-height:1.28}
.omap-sub{display:block;margin-top:1px;font-size:10px;font-weight:600;color:#96806A;letter-spacing:-.25px;line-height:1.45;word-break:keep-all}
.omap-tg{
  flex:0 0 auto;display:flex;align-items:center;gap:4px;min-height:29px;padding:5px 10px;
  border:1px solid #E7D6BE;border-radius:999px;background:#FFFDF8;color:#7A5B3E;
  font-size:10.5px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;
  box-shadow:0 2px 6px rgba(150,110,64,.10),0 1px 0 #fff inset;transition:transform .12s,background .15s;
}
.omap-tg:active{transform:scale(.96);background:#FFF6E4}
.omap-tg i{font-style:normal;font-size:9px;line-height:1;transition:transform .24s}
.omap.closed .omap-tg i{transform:rotate(180deg)}
.omap-plate{
  position:relative;margin-top:8px;border-radius:16px;overflow:hidden;
  aspect-ratio:5 / 4;max-height:46vh;background:#F7ECDA;
  border:1px solid #E8D6BC;
  box-shadow:0 6px 16px rgba(150,110,64,.14),0 1px 0 #fff inset;
}
.omap.closed .omap-plate,.omap.closed .omap-foot{display:none}
.omap-img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 46%}
.omap-pins{position:absolute;inset:0;pointer-events:none}
.omap-pin{
  position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);pointer-events:auto;
  display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;
  border:1px solid rgba(255,255,255,.9);background:rgba(255,253,247,.94);
  color:#5B4231;font-size:11px;font-weight:800;letter-spacing:-.35px;white-space:nowrap;
  box-shadow:0 4px 12px rgba(110,78,42,.22),0 1px 0 #fff inset;backdrop-filter:blur(3px);
  transition:transform .16s,background .16s,color .16s,box-shadow .16s;
}
.omap-pin .pd{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--pc,#E8A88F);box-shadow:0 0 0 2px rgba(255,255,255,.65)}
.omap-pin:active{transform:translate(-50%,-50%) scale(.95)}
.omap-pin.on{
  background:linear-gradient(180deg,#71492A 0%,#472C19 100%);color:#FFF7EA;border-color:#C9A46E;
  box-shadow:0 0 0 2px rgba(232,190,110,.72),0 8px 18px rgba(71,44,25,.34);
}
.omap-pin.on .pd{box-shadow:0 0 0 0 rgba(255,255,255,.8);animation:pinPulse 2.1s infinite}
@keyframes pinPulse{
  0%{box-shadow:0 0 0 0 rgba(255,255,255,.75)}
  70%{box-shadow:0 0 0 6px rgba(255,255,255,0)}
  100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}
}
.omap-foot{display:flex;align-items:center;justify-content:space-between;gap:5px 10px;flex-wrap:wrap;padding:7px 2px 1px}
.omap-guide{font-size:9.5px;font-weight:700;color:#9A7E62;letter-spacing:-.25px;line-height:1.4}
.omap-legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.omap-lg{display:flex;align-items:center;gap:3px;font-size:9.5px;font-weight:800;color:#A08A76;letter-spacing:-.25px;transition:color .15s}
.omap-lg i{display:block;width:6px;height:6px;border-radius:50%;background:var(--pc);opacity:.55;transition:opacity .15s,transform .15s}
.omap-lg.on{color:#5E4633}
.omap-lg.on i{opacity:1;transform:scale(1.25)}

.roomline{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:2px 14px 7px;font-size:10.5px;font-weight:700;color:#8A6A4F;letter-spacing:-.2px;
  flex:0 0 auto;min-width:0;
}
.roomline-l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cost-chip{
  flex:0 0 auto;border:1px solid #F0E1C8;background:#FFF6E6;color:#96785B;
  font-size:10px;font-weight:700;padding:3.5px 8px;border-radius:999px;
}
.cost-chip:active{background:#FFEFD6}

.chat{
  flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:6px 12px 12px;display:flex;flex-direction:column;gap:11px;
  background:linear-gradient(180deg,#FFFDF9 0%,#FFFCF6 100%);
}
.chat::-webkit-scrollbar{width:6px}
.chat::-webkit-scrollbar-thumb{background:#E7D8C2;border-radius:3px}

.m-user{display:flex;justify-content:flex-end;align-items:flex-start;gap:6px}
.m-user .bubble{
  max-width:79%;padding:10px 13px;
  background:var(--peach);border:1px solid var(--peach-line);
  border-radius:16px 16px 4px 16px;
  font-size:13.5px;line-height:1.6;color:#4A2E23;
  white-space:pre-wrap;word-break:break-word;
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset;
}
.m-user .u-avatar{
  width:24px;height:24px;border-radius:50%;flex:0 0 auto;
  display:grid;place-items:center;font-size:12px;
  background:linear-gradient(160deg,#FFF3C8,#F2D488);border:1px solid #E9CD8C;
}
.m-time{font-size:9.5px;color:#B49C88;margin-top:4px;text-align:right}

.m-ai{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start}
.m-ai .a-avatar{
  width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13.5px;
  background:var(--tint,#F4E9D8);border:1px solid rgba(120,90,50,.10);
  box-shadow:0 1px 0 #fff inset,0 3px 8px rgba(120,90,50,.12);
}
.m-ai .a-body{min-width:0}
.m-ai .a-head{display:flex;align-items:baseline;gap:6px;margin:1px 0 4px;flex-wrap:wrap}
.m-ai .a-name{font-size:12px;font-weight:800;color:#43301F;letter-spacing:-.3px}
.m-ai .a-title{font-size:10px;font-weight:600;color:#A28C78}
.m-ai .a-time{font-size:10px;color:#B7A492}
.tag{font-size:9px;font-weight:800;padding:1px 5px;border-radius:6px;letter-spacing:-.2px;background:#F1E7D6;color:#967A5A}
.tag.ai{background:#E7F0FB;color:#3E6F9E}
.tag.gpt{background:#E9F6EE;color:#2C7A55}
.tag.err{background:#FDECEA;color:#B04A32}
.m-ai .bubble{
  background:#FDF8EE;border:1px solid #EFE3CF;
  border-radius:4px 14px 14px 14px;
  padding:10px 13px;font-size:13.5px;line-height:1.62;color:#3E2E20;
  white-space:pre-wrap;word-break:break-word;
  box-shadow:0 1px 0 rgba(255,255,255,.75) inset;
}
.m-sys{align-self:center;font-size:10.5px;color:#A28C78;background:#F8F0E2;
  border:1px dashed #E6D6BE;border-radius:999px;padding:4px 10px;text-align:center;line-height:1.5}

.typing{display:flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:#C9B49B;animation:bounce 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.55}30%{transform:translateY(-4px);opacity:1}}

/* ───────── 입력 바 ───────── */
.composer{
  flex:0 0 auto;border-top:1px solid var(--line);
  background:linear-gradient(180deg,#FFFDF8,#FFFBF1);
  padding:8px 10px calc(9px + var(--safe-b));
}
.chip-row{display:flex;align-items:center;gap:5px;padding-bottom:7px;overflow-x:auto;scrollbar-width:none;min-width:0}
.chip-row::-webkit-scrollbar{display:none}
.chip-row.mentions{padding-bottom:8px}
.chip-row.scroll-x{
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),rgba(0,0,0,0) 100%);
}
.lbl{font-size:10px;font-weight:700;color:#A08A76;flex:0 0 auto;padding-left:2px}
.chips{display:flex;gap:5px;flex:0 0 auto}
.chip{
  flex:0 0 auto;display:flex;align-items:center;gap:3px;
  min-height:34px;padding:6px 10px;border-radius:999px;border:1px solid var(--line-2);
  background:#fff;color:#5E4835;font-size:11px;font-weight:700;letter-spacing:-.4px;
  transition:.15s;white-space:nowrap;touch-action:manipulation;
}
.chip.active{background:linear-gradient(180deg,#8D5C2C,#6A3F1C);color:#fff;border-color:#5F3714;box-shadow:0 4px 10px rgba(107,66,28,.26)}
.chip.mention{border-style:dashed;background:#FFFCF5;color:#8A6A4F;font-weight:600}
.chip.mention:active{background:#FFF6E4;border-style:solid}
.inputbar{display:flex;gap:8px;align-items:flex-end}
#input{
  flex:1;min-width:0;min-height:44px;max-height:112px;resize:none;
  padding:11px 13px;border-radius:14px;border:1px solid var(--line-2);
  background:#fff;font-size:13.5px;line-height:1.5;
  outline:none;transition:border-color .15s,box-shadow .15s;
}
#input::placeholder{color:#B8A492}
#input:focus{border-color:#CB9F72;box-shadow:0 0 0 3px rgba(203,159,114,.16)}
.send{
  width:46px;height:46px;flex:0 0 auto;border:0;border-radius:14px;
  background:linear-gradient(180deg,#8D5C2C,#6A3F1C);color:#fff;font-size:16px;
  display:grid;place-items:center;box-shadow:0 6px 14px rgba(107,66,28,.28);
  transition:transform .12s,opacity .15s;touch-action:manipulation;
}
.send:active{transform:scale(.95)}
.send:disabled{opacity:.45;box-shadow:none;cursor:default}

/* ───────── 공통 뷰 ───────── */
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:15px 16px 9px;flex:0 0 auto}
.view-head h2{margin:0;font-size:16px;font-weight:800;letter-spacing:-.5px;color:#3A2A1B}
.view-sub{margin:3px 0 0;font-size:11px;color:#9C8674;font-weight:600}
.btn{
  border-radius:11px;border:1px solid var(--line-2);background:#fff;
  padding:9px 12px;font-size:12px;font-weight:700;color:#5E4835;transition:.15s;touch-action:manipulation;
}
.btn:active{background:#FFF8EA}
.btn.primary{background:linear-gradient(180deg,#8D5C2C,#6A3F1C);color:#fff;border-color:#5F3714;box-shadow:0 4px 10px rgba(107,66,28,.22)}
.btn.ghost{background:#FFFCF5}
.btn.mini{padding:6px 10px;font-size:11px;border-radius:9px}
.btn.danger{color:#B04A32;border-color:#EFCFC4;background:#FFF7F4}

.filters{display:flex;gap:6px;padding:0 16px 10px;flex:0 0 auto}
.f-chip{
  border:1px solid var(--line-2);background:#FFFCF5;color:#7B6653;
  border-radius:999px;min-height:34px;padding:6px 13px;font-size:11.5px;font-weight:700;
}
.f-chip.active{background:#5E4633;color:#fff;border-color:#4A3524}

.list{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:0 16px 18px;display:flex;flex-direction:column;gap:9px}
.list > *{flex:0 0 auto}
.list::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb{background:#E7D8C2;border-radius:3px}
.empty{text-align:center;color:#A89480;font-size:12px;line-height:1.8;padding:30px 16px;
  border:1px dashed #E8D9C2;border-radius:16px;background:#FFFCF5}

.task{
  position:relative;background:#FFFCF5;border:1px solid var(--line);
  border-left:4px solid var(--tc,#C9A277);border-radius:13px;padding:11px 12px 10px;
}
.task.done{opacity:.62;background:#FAF7F0}
.task-top{display:flex;align-items:flex-start;gap:8px}
.task-title{flex:1;font-size:12.5px;font-weight:800;color:#3E2E20;line-height:1.45;letter-spacing:-.3px;word-break:break-word}
.task.done .task-title{text-decoration:line-through;text-decoration-color:#C9B6A0}
.pill{flex:0 0 auto;font-size:9.5px;font-weight:800;padding:2.5px 7px;border-radius:999px;letter-spacing:-.2px;border:1px solid transparent;white-space:nowrap}
.pill.대기{background:#F1ECE3;color:#7E6C58;border-color:#E4DBCC}
.pill.진행중{background:var(--amber-bg);color:var(--amber);border-color:#F2DCAE}
.pill.완료{background:var(--green-bg);color:var(--green);border-color:#CBE8D6}
.task-meta{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap;font-size:10.5px;color:#9C8674;font-weight:600}
.task-meta .owner{display:flex;align-items:center;gap:3px;color:#6B5644}
.task-detail{margin:7px 0 0;font-size:11.5px;color:#7B6653;line-height:1.55;padding-top:7px;border-top:1px dashed #EADFCB;word-break:break-word}
.task-actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}

.staff{background:#FFFCF5;border:1px solid var(--line);border-radius:15px;padding:13px;position:relative;overflow:hidden}
.staff::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--tc,#C9A277),transparent 85%)}
.staff-top{display:flex;align-items:center;gap:10px}
.staff-avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;
  background:var(--tint,#F4E9D8);border:1px solid rgba(120,90,50,.10);box-shadow:0 1px 0 #fff inset,0 4px 10px rgba(120,90,50,.10)}
.staff-id{flex:1;min-width:0}
.staff-name{font-size:13.5px;font-weight:800;color:#3A2A1B;letter-spacing:-.3px}
.staff-role{font-size:10.5px;color:#9C8674;font-weight:600;margin-top:1px}
.staff-state{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:800;color:var(--green);
  background:var(--green-bg);border:1px solid #CBE8D6;padding:3px 8px;border-radius:999px;white-space:nowrap}
.staff-state.busy{color:var(--amber);background:var(--amber-bg);border-color:#F2DCAE}
.staff-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:11px}
.stat{background:#FFF8EC;border:1px solid #F0E4D2;border-radius:10px;padding:7px 8px;text-align:center}
.stat b{display:block;font-size:14px;font-weight:800;color:#5E4633;letter-spacing:-.4px}
.stat span{font-size:9.5px;color:#A89480;font-weight:700}
.staff-report{margin-top:10px;font-size:11px;color:#7B6653;line-height:1.55;background:#FFFDF8;
  border:1px dashed #EADFCB;border-radius:10px;padding:8px 10px;word-break:break-word}
.staff-report b{display:block;font-size:9.5px;color:#A89480;font-weight:800;margin-bottom:2px}
.staff-foot{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.edit-grid{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.edit-grid label{font-size:10px;font-weight:800;color:#A89480}
.edit-grid input{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line-2);font-size:13px;outline:none;background:#fff}
.edit-grid input:focus{border-color:#CB9F72}

.newtask{margin:0 16px 10px;padding:11px;border-radius:13px;background:#FFF7E9;border:1px solid #F0E1C8;
  display:flex;flex-direction:column;gap:7px}
.newtask input{width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line-2);font-size:13px;outline:none;background:#fff}
.newtask-row{display:flex;gap:6px;align-items:center}
.newtask select{flex:1;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--line-2);font-size:12.5px;background:#fff;outline:none}

.memo-add{margin:0 16px 10px;display:flex;flex-direction:column;gap:7px;flex:0 0 auto}
.memo-add textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line-2);
  font-size:13px;line-height:1.55;resize:none;outline:none;background:#fff}
.memo-add textarea:focus{border-color:#CB9F72;box-shadow:0 0 0 3px rgba(203,159,114,.15)}
.memo-add-row{display:flex;gap:6px}
.memo-add-row input{flex:1;min-width:0;padding:9px 11px;border-radius:10px;border:1px solid var(--line-2);font-size:13px;outline:none;background:#fff}
.searchbar{padding:0 16px 10px;flex:0 0 auto}
.searchbar input{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line-2);font-size:13px;outline:none;background:#FFFDF8}
.searchbar input:focus{border-color:#CB9F72;background:#fff}
.memo{background:#FFFDF5;border:1px solid var(--line);border-left:4px solid #E4C88F;border-radius:12px;padding:10px 12px}
.memo-text{font-size:12.5px;line-height:1.6;color:#3E2E20;white-space:pre-wrap;word-break:break-word}
.memo-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}
.memo-meta{font-size:10px;color:#A89480;font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.memo-tag{background:#F6EBD6;color:#96744A;border-radius:6px;padding:1px 6px;font-size:9.5px;font-weight:800}
.memo-del{border:0;background:none;color:#C2A891;font-size:13px;padding:3px 5px}
.memo-del:active{color:#B04A32}

/* ───────── 첨부 · 이미지 생성 ───────── */
.attach-btn{
  width:44px;height:44px;flex:0 0 auto;border-radius:14px;border:1px solid var(--line-2);
  background:#FFFCF4;font-size:18px;line-height:1;display:grid;place-items:center;
  transition:transform .12s,background .15s,border-color .15s;touch-action:manipulation;
}
.attach-btn:active{background:#FFF2DC;transform:scale(.95)}
.attach-btn.on{
  border-color:#CB9F72;background:linear-gradient(180deg,#8D5C2C,#6A3F1C);color:#fff;
  box-shadow:0 5px 12px rgba(107,66,28,.26);
}
.gen-btn{font-size:17px}
.gen-row{padding-bottom:7px}
.gen-hint{
  flex:0 0 auto;font-size:10px;font-weight:700;color:#96785B;background:#FFF6E6;
  border:1px solid #F0E1C8;border-radius:999px;padding:4px 8px;white-space:nowrap;
}
.chip.ratio{font-size:10.5px;padding:5px 9px;min-height:30px}

.attach-chip{
  display:flex;align-items:center;gap:6px;flex:0 0 auto;max-width:200px;
  padding:4px 6px 4px 4px;border:1px solid var(--line-2);border-radius:12px;background:#fff;
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset;
}
.attach-chip .th{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:0 0 auto;
  background:#F4EADA;display:grid;place-items:center;font-size:15px;overflow:hidden}
.attach-chip .th img{width:100%;height:100%;object-fit:cover;display:block}
.attach-chip .nm{min-width:0;line-height:1.25}
.attach-chip .nm b{display:block;font-size:10.5px;font-weight:800;color:#5E4835;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:112px}
.attach-chip .nm span{display:block;font-size:9px;color:#A89480;font-weight:700}
.attach-chip .x{border:0;background:#F7EFE2;color:#96744A;border-radius:50%;
  width:19px;height:19px;min-width:19px;font-size:10px;line-height:1;display:grid;place-items:center;flex:0 0 auto}
.attach-chip .x:active{background:#F3DFC4}

.atts{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px}
.m-user .atts{justify-content:flex-end}
.atts .att-th{width:74px;height:74px;object-fit:cover;border-radius:10px;
  border:1px solid var(--peach-line);background:#fff;display:block}
.att-doc{display:inline-flex;align-items:center;gap:4px;max-width:100%;font-size:10.5px;font-weight:800;
  color:#5E4835;background:#FFF6E6;border:1px solid #F0E1C8;border-radius:9px;padding:5px 8px}
.att-doc i{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}

.gen-wrap{margin-top:2px}
.gen-img{display:block;width:100%;max-width:270px;height:auto;border-radius:12px;
  border:1px solid #E7D8C2;background:#fff;cursor:zoom-in}
.img-tools{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.img-tools .btn{padding:5px 9px;font-size:10.5px;border-radius:9px}
.img-meta{font-size:9.5px;color:#A89480;font-weight:700;margin-top:5px;line-height:1.45;word-break:break-all}

.lightbox{position:fixed;inset:0;z-index:90;background:rgba(32,20,10,.88);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.lightbox img{max-width:100%;max-height:74vh;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.5);background:#fff}
.lb-close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;
  width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:17px}
.lb-tools{display:flex;gap:8px}
.lb-tools .btn{background:rgba(255,255,255,.94);border-color:transparent}
.lb-cap{color:#F4EADB;font-size:11px;font-weight:700;max-width:92vw;text-align:center;line-height:1.5;word-break:break-word}

/* ───────── 설정 시트 ───────── */
.overlay{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:14px;background:rgba(60,42,24,.34);backdrop-filter:blur(3px);animation:fade .18s ease-out;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:min(470px,100%);max-height:90dvh;max-height:90vh;display:flex;flex-direction:column;
  background:var(--card);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 30px 70px rgba(60,40,20,.32);overflow:hidden;
  animation:rise .22s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes rise{from{transform:translateY(14px) scale(.985);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
  border-bottom:1px solid var(--line);background:#FFFCF5}
.sheet-head h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.4px;color:#3A2A1B}
.x{border:0;background:none;font-size:16px;color:#A89480;padding:6px;line-height:1}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 16px 6px}
.sheet-body::-webkit-scrollbar{width:6px}
.sheet-body::-webkit-scrollbar-thumb{background:#E7D8C2;border-radius:3px}
.sheet-foot{display:flex;gap:8px;justify-content:flex-end;padding:11px 16px calc(11px + var(--safe-b));
  border-top:1px solid var(--line);background:#FFFCF5}
.sec{margin-bottom:16px}
.sec-title{font-size:10.5px;font-weight:800;color:#A89480;letter-spacing:.2px;margin:0 0 7px;
  display:flex;align-items:center;gap:5px}
.field{margin-bottom:9px}
.field label{display:block;font-size:10.5px;font-weight:700;color:#8A7159;margin-bottom:4px}
.field input,.field select{width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line-2);
  font-size:13px;outline:none;background:#fff}
.field input:focus,.field select:focus{border-color:#CB9F72;box-shadow:0 0 0 3px rgba(203,159,114,.15)}
.field textarea{width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line-2);
  font-size:13px;line-height:1.62;outline:none;background:#fff;resize:vertical;min-height:104px}
.field textarea:focus{border-color:#CB9F72;box-shadow:0 0 0 3px rgba(203,159,114,.15)}
.hint{font-size:10.5px;color:#A89480;margin-top:4px;line-height:1.55}

/* ───────── 지침(공통 규칙) 관리 ───────── */
.gd-stat{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10.5px;font-weight:700;color:#6B4A28;
  background:#FFF9EE;border:1px solid #F0E1C8;border-radius:10px;padding:8px 10px;margin-bottom:8px;line-height:1.5}
.gd-stat em{font-style:normal;color:#A89480;font-weight:600}
.gd-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line-2);
  border-radius:12px;background:#fff;margin-bottom:6px}
.gd-row.off{background:#FBF7F0;opacity:.72}
.gd-tg{flex:0 0 auto;width:40px;height:23px;border-radius:99px;border:1px solid var(--line-2);
  background:#EDE3D5;position:relative;padding:0;transition:background .16s,border-color .16s}
.gd-tg i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(90,60,30,.28);transition:left .16s}
.gd-tg.on{background:linear-gradient(180deg,#3FA365,#2E8B57);border-color:#2E8B57}
.gd-tg.on i{left:20px}
.gd-main{flex:1 1 auto;min-width:0}
.gd-name{font-size:12px;font-weight:800;color:#3B2A1C;letter-spacing:-.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gd-meta{font-size:9.5px;color:#A89480;font-weight:600;margin-top:1px}
.gd-act{display:flex;gap:3px;flex:0 0 auto}
.gd-act button{border:1px solid var(--line-2);background:#FFFCF5;border-radius:8px;padding:5px 7px;font-size:11px;line-height:1}
.gd-act button.del{color:#B04A32;border-color:#EFCFC4;background:#FFF7F4}
.gd-empty{font-size:11px;color:#A89480;background:#FBF7F0;border:1px dashed var(--line-2);
  border-radius:11px;padding:12px;text-align:center;line-height:1.6;margin-bottom:7px}
/* GPT 모델별 1회 예상 비용 목록 */
.gpt-price{border:1px solid var(--line-2);border-radius:10px;background:#fff;overflow:hidden;margin:2px 0 8px}
.gpt-row{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:6px 9px;border-top:1px dashed #F1E6D4;font-size:10.5px;color:#6B5644}
.gpt-row:first-child{border-top:0}
.gpt-row.on{background:#FFF9EC}
.gpt-row .nm{min-width:0;font-weight:800;color:#3B2A1C;line-height:1.35}
.gpt-row .nm i{display:block;font-style:normal;font-weight:600;color:#A89480;font-size:9.5px}
.gpt-row b{flex:0 0 auto;color:#2C7A55;font-weight:800;white-space:nowrap}
.field .hint{font-size:10px;margin-top:4px;line-height:1.5}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line-2);border-radius:11px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:#fff;padding:10px 8px;font-size:12px;font-weight:700;color:#7B6653}
.seg button.on{background:linear-gradient(180deg,#8D5C2C,#6A3F1C);color:#fff}
.price-tbl{width:100%;border-collapse:collapse;font-size:10.5px;margin-top:6px;background:#fff;border-radius:10px;overflow:hidden}
.price-tbl th,.price-tbl td{border:1px solid #F0E4D2;padding:5px 6px;text-align:center;color:#6B5644}
.price-tbl th{background:#FFF6E6;font-weight:800;color:#6B4A28;font-size:10px}
.price-tbl td.l{text-align:left;font-weight:700;white-space:nowrap}
.price-tbl tr.on td{background:#FFF9EC}
.price-tbl td.pick{color:#2E8B57;font-weight:800}
.box{background:#FFF9EE;border:1px solid #F0E1C8;border-radius:12px;padding:11px 12px}
.usage-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.usage-cell{background:#fff;border:1px solid #F0E4D2;border-radius:9px;padding:7px 9px}
.usage-cell span{display:block;font-size:9.5px;color:#A89480;font-weight:700}
.usage-cell b{font-size:13px;font-weight:800;color:#5E4633;letter-spacing:-.3px}
.notice{font-size:10.5px;line-height:1.65;color:#8A7159;background:#FFF9EE;border:1px solid #F0E1C8;
  border-left:3px solid #D9B877;border-radius:9px;padding:8px 10px}
.notice b{color:#6B4A28}
.status-line{font-size:11px;font-weight:700;margin-top:6px;line-height:1.5}
.status-line.ok{color:var(--green)}
.status-line.err{color:#B04A32}
.howto{font-size:11px;line-height:1.75;color:#6B5644}
.howto b{color:#5E3616}
.howto ol{margin:4px 0 0;padding-left:17px}
.howto li{margin-bottom:2px}

/* ───────── 토스트 ───────── */
.toast-wrap{position:fixed;left:50%;bottom:190px;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:8px;align-items:center;z-index:80;
  pointer-events:none;width:max-content;max-width:92vw}
.toast{background:rgba(58,42,27,.94);color:#FFF8EC;font-size:12px;font-weight:600;
  padding:10px 15px;border-radius:12px;box-shadow:0 12px 30px rgba(40,25,10,.3);
  animation:toastIn .22s ease-out;max-width:92vw;text-align:center;line-height:1.5}
@keyframes toastIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* ───────── 폰 화면 ───────── */
@media (max-width:640px){
  body{padding:0;display:block;height:100dvh;overflow:hidden;background:var(--card)}
  .app{width:100%;height:100dvh;max-height:100dvh;border:0;border-radius:0;box-shadow:none}
  #input{font-size:16px;min-height:46px}
  .m-user .bubble,.m-ai .bubble{font-size:14px}
  .omap-plate{max-height:42vh}
  .memo-add textarea,.memo-add-row input,.searchbar input,.newtask input,.field input,.field select,.field textarea{font-size:16px}
}
@media (max-width:400px){
  .attach-btn{width:42px;height:42px}
  .inputbar{gap:6px}
  .brand h1{font-size:15.5px}
  .crest{width:38px;height:38px;font-size:18px;border-radius:12px}
  .hdr{padding-left:12px;padding-right:12px;gap:6px}
  .live span.long{display:none}
  .live span.short{display:inline}
  .live{padding:6px 9px;font-size:10px}
  .tab{font-size:10.5px}
  .tab .ticon{font-size:15px}
  .chip-row .lbl{display:none}
  .chip-row{gap:3px}
  .chips{gap:3px}
  .chip{font-size:10.5px;padding:6px 7px;gap:2px}
  .toast-wrap{bottom:196px}
  .omap{margin:8px 8px 0;padding:8px 9px 7px;border-radius:17px}
  .omap-ico{width:25px;height:25px;font-size:13px;border-radius:8px}
  .omap-tt b{font-size:12px}
  .omap-sub{font-size:9.5px}
  .omap-tg{min-height:27px;padding:4px 8px;font-size:10px}
  .omap-pin{font-size:10.5px;padding:5px 9px;gap:4px;letter-spacing:-.4px}
  .omap-pin .pd{width:7px;height:7px}
  .omap-guide{font-size:9px}
  .omap-lg{font-size:9px;gap:2px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ───────── 헤더 ───────── -->
  <header class="hdr">
    <div class="brand">
      <div class="crest" aria-hidden="true">👑</div>
      <div class="brand-txt">
        <h1 id="officeName">마르스 비서실</h1>
        <p class="sub"><span class="dot"></span><span id="ownerLine">마르스 님 전용</span></p>
      </div>
    </div>
    <div class="hdr-right">
      <button class="live" id="storeBadge" title="저장 상태"><i></i><span id="storeText" class="long">이 기기 저장</span><span id="storeTextShort" class="short">저장</span></button>
      <button class="gear" id="btnSettings" aria-label="설정">⚙️</button>
    </div>
  </header>

  <!-- ───────── 탭 ───────── -->
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab active" data-tab="chat" role="tab"><span class="ticon">💬</span>회의실</button>
    <button class="tab" data-tab="tasks" role="tab"><span class="ticon">📋</span>작업실<span class="tab-badge hide" id="taskBadge">0</span></button>
    <button class="tab" data-tab="staff" role="tab"><span class="ticon">📊</span>비서현황</button>
    <button class="tab" data-tab="memo" role="tab"><span class="ticon">📝</span>메모</button>
  </nav>

  <main class="body" id="body">

    <!-- ───────── 회의실 ───────── -->
    <section class="view active" id="view-chat">
      <section class="omap" id="officeMap" aria-label="오피스 맵">
        <div class="omap-head">
          <span class="omap-ico" aria-hidden="true">🗺️</span>
          <div class="omap-tt">
            <b>오피스 맵</b>
            <span class="omap-sub">대회의실 · 지휘실 · 라운지, 다섯 명의 비서가 움직입니다.</span>
          </div>
          <button class="omap-tg" id="btnMapToggle" aria-expanded="true" aria-controls="omapPlate" aria-label="오피스 맵 접기">
            <span id="mapToggleTxt">접기</span><i aria-hidden="true">▴</i>
          </button>
        </div>
        <div class="omap-plate" id="omapPlate">
          <img class="omap-img" id="omapImg" src="./assets/office-map.jpg" alt="마르스 비서실 클레이 3D 오피스 맵" width="1200" height="960" decoding="async">
          <div class="omap-pins" id="omapPins"></div>

    });
    if (!Array.isArray(out.rooms) || !out.rooms.length) out.rooms = d.rooms;
    if (!out.messages || typeof out.messages !== 'object') out.messages = {};
    out.rooms.forEach((r) => { if (!Array.isArray(out.messages[r.id])) out.messages[r.id] = []; });
    if (!Array.isArray(out.tasks)) out.tasks = [];
    if (!Array.isArray(out.memos)) out.memos = [];
    out.guidelines = normalizeGuides(out.guidelines, s);
    if (!out.usage || typeof out.usage !== 'object' || Array.isArray(out.usage)) out.usage = {};
    if (!out.rooms.some((r) => r.id === out.activeRoom)) out.activeRoom = out.rooms[0].id;
    if (!['chat', 'tasks', 'staff', 'memo'].includes(out.ui.tab)) out.ui.tab = 'chat';
    if (typeof out.ui.mapOpen !== 'boolean') out.ui.mapOpen = true;
    return out;
  }

  /* ───────── 지침(공통 규칙) 보관·주입 ───────── */
  const GUIDE_MAX_DOC = 20000;      // 지침 1건 최대 글자
  const GUIDE_MAX_TOTAL = 24000;    // 프롬프트에 넣는 지침 총 글자 상한(토큰·비용 상한)

  function cleanGuideText(t) {
    return String(t == null ? '' : t).replace(/\r\n?/g, '\n').replace(/\u0000/g, '').trim();
  }

  function guideFromAny(x, idx) {
    if (!x) return null;
    let name = '', text = '', enabled = true, source = '불러오기', preset = false;
    if (typeof x === 'string') { text = cleanGuideText(x); }
    else if (typeof x === 'object') {
      name = String(x.name || x.title || x.file || '').trim();
      text = cleanGuideText(x.text != null ? x.text : (x.content != null ? x.content : x.body));
      enabled = x.enabled !== false;
      source = String(x.source || '불러오기').slice(0, 12);
      preset = !!x.preset;
    }
    text = text.slice(0, GUIDE_MAX_DOC);
    if (!text) return null;
    if (!name) name = '지침 ' + (idx + 1);
    return {
      id: (x && typeof x === 'object' && x.id) ? String(x.id) : uid('g'),
      name: name.slice(0, 60), text, enabled, preset, source,
      createdAt: (x && x.createdAt) || nowISO(), updatedAt: (x && x.updatedAt) || nowISO()
    };
  }

  function normalizeGuides(list, fallbackHost) {
    let arr = list;
    if (arr == null && fallbackHost && fallbackHost.guidelines != null) arr = fallbackHost.guidelines;
    if (arr && !Array.isArray(arr) && typeof arr === 'object') {
      // {지침이름: 본문} 형태도 받아준다
      arr = Object.keys(arr).map((k) => ({ name: k, text: arr[k] }));
    }
    if (!Array.isArray(arr)) return [presetGuide()];
    const out = arr.map((x, i) => guideFromAny(x, i)).filter(Boolean);
    return out;
  }

  function activeGuides() {
    if (!state || !Array.isArray(state.guidelines)) return [];
    return state.guidelines.filter((g) => g && g.enabled !== false && String(g.text || '').trim());
  }
  function guidesChars(list) {
    return (list || []).reduce((n, g) => n + String(g.text || '').length, 0);
  }
  function guideTokens(chars) { return Math.round((chars || 0) / 1.5); }   // 한국어 기준 보수적 추정
  function guideCostKRW(tokens) { return (tokens / 1e6) * priceOf(state.settings.model).in * USD_KRW; }

  /* 활성 지침만, 상한(GUIDE_MAX_TOTAL) 안에서 프롬프트용 텍스트로 묶는다 */
  function guideBlock(maxChars) {
    const list = activeGuides();
    if (!list.length) return { text: '', count: 0, chars: 0, names: [], truncated: false };
    const cap = maxChars || GUIDE_MAX_TOTAL;
    let used = 0, truncated = false;
    const parts = [], names = [];
    for (const g of list) {
      const body = String(g.text || '').replace(/^\s*\uFEFF/, '').trim();
      names.push(g.name);
      if (used >= cap) { truncated = true; break; }
      const room = cap - used;
      if (body.length <= room) {
        parts.push('### ' + g.name + '\n' + body);
        used += body.length;
      } else {
        parts.push('### ' + g.name + '\n' + body.slice(0, Math.max(0, room - 20)).replace(/\s+\S*$/, '') +
          '\n… (분량 초과로 이하 생략)');
        used = cap; truncated = true;
        break;
      }
    }
    return { text: parts.join('\n\n'), count: names.length, chars: used, names, truncated };
  }

  function loadState() {
    let loaded = null;
    const raw = storeGet(LS_STATE);
    if (raw) {
      try { loaded = JSON.parse(raw); } catch (e) { loaded = null; }
    }
    state = migrate(loaded);
    if (!loaded) saveNow();
    return !!loaded;
  }

  function save() {
    if (!state) return;
    state.meta = state.meta || {};
    state.meta.updatedAt = nowISO();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 120);
  }
  function saveNow() {

    if (!ok) storeOK = false;
    renderStoreBadge();
  }

  /* ───────── 이 기기 저장 · AI 키 ───────── */
  function maskKey(key) {
    if (!key) return '';
    if (key.length <= 10) return '****';
    return key.slice(0, 4) + '…' + key.slice(-4);
  }
  function loadKey() {
    let key = '';
    try { key = String(storeGet(LS_API) || '').trim(); } catch (e) { key = ''; }
    ai.apiKey = key;

  function setOpenaiKey(key) {

  function renderStoreBadge() {

  }

  /* ───────── 사용량·비용 (이 기기 집계) ───────── */
  const USD_KRW = 1400;
  const PRICING = {
    'gemini-3.5-flash-lite': { in: 0.30, out: 2.50 },
    'gemini-2.5-flash-lite': { in: 0.10, out: 0.40 },
    'gemini-3.5-flash': { in: 0.30, out: 2.50 }
  };
  /* 🧠 OpenAI (지피티) 모델·단가 — 2026-11-27 platform.openai.com/docs/pricing 확인 (USD / 1M토큰) */
  const OPENAI_MODELS = {
    'gpt-6-luna': { label: 'GPT-6 Luna', note: '최저가 · 기본', in: 0.10, out: 0.50, reasoning: true },
    'gpt-5-mini': { label: 'GPT-5 mini', note: '안정판 · 저가', in: 0.25, out: 2.00, reasoning: true },
    'gpt-6.1-terra': { label: 'GPT-6.1 Terra', note: '균형 · 사진 판독', in: 1.00, out: 5.00, reasoning: true },
    'gpt-6.2-sol': { label: 'GPT-6.2 Sol', note: '품질 우선', in: 2.00, out: 10.00, reasoning: true },
    'gpt-4o-mini': { label: 'GPT-4o mini', note: '구형 · 2027-01-14 지원종료 예정', in: 0.15, out: 0.60, reasoning: false },
    'gpt-4.1-mini': { label: 'GPT-4.1 mini', note: '구형 · 안정', in: 0.40, out: 1.60, reasoning: false }
  };
  const OPENAI_DEFAULT_MODEL = 'gpt-6-luna';
  const OPENAI_EST_IN = 2000;   // 지침·대화·지시 포함 보수적 입력 토큰
  const OPENAI_EST_OUT = 700;   // 답변 + 생각(reasoning) 토큰

  function priceOf(model) {
    if (PRICING[model]) return PRICING[model];
    if (OPENAI_MODELS[model]) return { in: OPENAI_MODELS[model].in, out: OPENAI_MODELS[model].out };
    return PRICING['gemini-3.5-flash-lite'];
  }
  function normalizeOpenAIModel(m) {
    const s = String(m || '').trim();
    return Object.prototype.hasOwnProperty.call(OPENAI_MODELS, s) ? s : OPENAI_DEFAULT_MODEL;
  }
  function openaiEstimateWon(model) {
    const o = OPENAI_MODELS[normalizeOpenAIModel(model)];
    const usd = (OPENAI_EST_IN / 1e6) * o.in + (OPENAI_EST_OUT / 1e6) * o.out;
    const krw = usd * USD_KRW;
    return krw < 10 ? Math.round(krw * 10) / 10 : Math.round(krw);
  }
  function estimateCost(model, pt, ot) {
    const p = priceOf(model);
    const usd = (pt / 1e6) * p.in + (ot / 1e6) * p.out;
    return { usd: Number(usd.toFixed(8)), krw: Number((usd * USD_KRW).toFixed(4)) };
  }
  function emptyUsage() { return { calls: 0, promptTokens: 0, outputTokens: 0, usd: 0, krw: 0 }; }
  function usageToday() {
    const u = (state && state.usage) || {};
    return Object.assign(emptyUsage(), u[today()] || {});
  }
  function usageMonth() {
    const m = emptyUsage();
    const prefix = today().slice(0, 7);
    const u = (state && state.usage) || {};
    Object.keys(u).forEach((k) => {
      if (k.slice(0, 7) !== prefix) return;
      const d = u[k] || {};
      m.calls += d.calls || 0;
      m.promptTokens += d.promptTokens || 0;
      m.outputTokens += d.outputTokens || 0;
      m.krw += Number(d && d.krw) || 0;
    });
    m.krw = Number(m.krw.toFixed(4));
    return m;
  }
  function recordUsage(model, pt, ot) {
    const c = estimateCost(model, pt, ot);
    if (!state.usage) state.usage = {};
    const k = today();
    const d = Object.assign(emptyUsage(), state.usage[k] || {});
    d.calls += 1;
    d.promptTokens += pt;
    d.outputTokens += ot;
    d.usd = Number((d.usd + c.usd).toFixed(8));
    d.krw = Number((d.krw + c.krw).toFixed(4));
    state.usage[k] = d;
    const keys = Object.keys(state.usage).sort();
    while (keys.length > 40) { delete state.usage[keys.shift()]; }
    return c;
  }
  function wonText(krw) {
    const n = Number(krw || 0);
    if (n <= 0) return '0원';
    if (n < 1) return n.toFixed(2) + '원';
    if (n < 100) return n.toFixed(1) + '원';
    return Math.round(n).toLocaleString('ko-KR') + '원';
  }
  function renderCost() {
    const chip = $('#costChip');
    if (!chip) return;
    const show = !!((ai.enabled || ai.openaiEnabled) && state && state.settings.showCost);
    chip.classList.toggle('hide', !show);
    if (!show) return;
    const t = usageToday();
    chip.textContent = '💰 오늘 ' + t.calls + '회 · ' + wonText(t.krw);
    chip.title = 'AI 호출 ' + t.calls + '회 · 입력 ' + t.promptTokens.toLocaleString('ko-KR') +
      ' + 출력 ' + t.outputTokens.toLocaleString('ko-KR') + ' 토큰 · 약 ' + wonText(t.krw) +
      '원 (Gemini·GPT 합산, 환율 ' + USD_KRW + '원 기준 추정)';
  }

  /* ───────── 렌더 ───────── */
  function assistantById(id) { return state.assistants.find((a) => a.id === id); }
  function activeRoom() { return state.rooms.find((r) => r.id === state.activeRoom) || state.rooms[0]; }

  /* 첨부 썸네일 · 파일 이름 줄 */
  function attsHTML(atts) {

  /* 생성 이미지 + 저장·확대·재생성 */

  /* 칩 줄이 화면보다 길면 오른쪽을 흐리게 해서 "더 넘길 수 있음"을 표시 */

  function renderTasks() {
    const filter = (state.ui.taskFilter || 'all');
    $$('#taskFilters .f-chip').forEach((b) => b.classList.toggle('active', b.dataset.filter === filter));
    const all = state.tasks.slice().sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    const list = filter === 'all' ? all : all.filter((t) => t.status === filter);
    const open = all.filter((t) => t.status !== '완료').length;
    const done = all.filter((t) => t.status === '완료').length;
    $('#taskSummary').textContent = all.length ? ('진행 ' + open + '건 · 완료 ' + done + '건 · 전체 ' + all.length + '건') : '등록된 작업이 없습니다';

  function parseTargets(text) {
    const raws = (text.match(/@[^\s@,]+/g) || []).map((s) => s.slice(1).replace(/[.,!?~)"']+$/, ''));
    if (!raws.length) return [state.assistants[0]];
    const norm = (s) => String(s).replace(/\s|_/g, '').toLowerCase();
    const ids = [];
    for (const raw of raws) {
      const r = norm(raw);
      if (['all', '전체', '모두', '비서진', '팀'].includes(r)) return state.assistants.slice();
      const hit = state.assistants.find((a) =>
        norm(a.name) === r || norm(String(a.title || '').replace('비서', '')) === r ||
        (a.aliases || []).some((al) => norm(al) === r)
      );
      if (hit && !ids.includes(hit.id)) ids.push(hit.id);
    }
    if (!ids.length) return [state.assistants[0]];
    return ids.map((id) => assistantById(id)).filter(Boolean);
  }

  function summarize(text, max) {
    let t = String(text).replace(/@[^\s@,]+/g, '').replace(/\s+/g, ' ').trim();
    t = t.replace(/^(좀|제발|지금|바로)\s+/g, '');
    if (!t) t = '지시 처리';
    const lim = max || 34;
    if (t.length <= lim) return t;
    const cut = t.slice(0, lim);
    const sp = cut.lastIndexOf(' ');
    const head = sp > lim * 0.55 ? cut.slice(0, sp) : cut;
    return head.replace(/[\s,·]$/, '') + '…';
  }

  const DEEP_KW = /(기획|아이디어|문안|카피|작성|써\s?줘|써줄|만들|분석|전략|비교|추천|조언|검토|요약|번역|계획|제안|어떻게|왜|알려|찾아|리스트|뽑아|짜\s?줘|보고서|초안|문장|제목|방법|순서|일정표|대본|스크립트)/;
  const SHALLOW_START = /^(접수|등록|처리|진행|실행|확인|알림|보고|올려|보내|잡아|해줘|해라|부탁|시작|완료)/;

  const ACK_ONLY = /^(응|웅|어|오케이|ok|okay|알겠|알겟|굿|좋아|좋습니다|고마워|수고|땡큐|ㅇㅋ|넵|네)[\s!~.ㅋㅎ]*$/i;
  function looksDeep(text) {
    const t = text.replace(/@[^\s@,]+/g, '').trim();
    if (!t) return false;
    if (t.length <= 5) return false;
    if (ACK_ONLY.test(t)) return false;
    if (DEEP_KW.test(t)) return true;
    // 지침이 등록돼 있으면 짧은 업무 지시도 바로 AI로 처리한다(지침 반영이 이 앱의 핵심)
    if (activeGuides().length && t.length >= 10) return true;
    if (SHALLOW_START.test(t) && t.length < 40) return false;
    return t.length >= 45;
  }
  function shouldUseAI(text) {
    if (!ai.enabled) return false;
    if (state.settings.responseMode === 'always') return true;
    return looksDeep(text);

  /* ───────── Gemini REST 직접 호출 (브라우저 → Google) ───────── */
  const API_BASE = 'https://generativelanguage.googleapis.com/v1beta/models/';

  function friendlyApiError(status, body) {
    const err = (body && body.error) || {};
    const msg = String(err.message || (typeof body === 'string' ? body : '') || '').slice(0, 240);
    const st = err.status || String(status);
    if (/API_KEY_INVALID|API key not valid|invalid api key/i.test(msg)) {
      return 'API 키가 유효하지 않습니다. Google AI Studio에서 키를 다시 확인해 주세요.';
    }
    if (/API key expired|expired/i.test(msg)) {
      return 'API 키가 만료되었습니다. Google AI Studio에서 새 키를 발급해 주세요.';
    }
    if (status === 403) return '이 키로는 해당 모델을 쓸 수 없습니다(403). AI Studio에서 키 권한을 확인해 주세요.';
    if (status === 429) return 'Gemini 사용 한도를 초과했습니다. 잠시 후 다시 시도해 주세요.';
    if (status === 404 || /not found|NOT_FOUND/i.test(msg)) {
      return '모델 이름을 찾을 수 없습니다. 설정에서 gemini-3.5-flash-lite로 바꿔 주세요.';
    }
    if (status === 400 && /API key/i.test(msg)) return 'API 키가 올바르지 않습니다(400). 키를 다시 확인해 주세요.';
    return 'Gemini 호출에 실패했습니다(' + st + '): ' + (msg || '알 수 없는 오류');
  }

  async function callGemini(opts) {
    const o = opts || {};
    if (!ai.apiKey) {
      throw new Error('API 키가 없습니다. ⚙️ 설정에서 Google AI Studio 키를 먼저 저장해 주세요.');
    }
    const useModel = normalizeModel(o.model || state.settings.model);
    const contents = [];
    const push = (role, text) => {
      const t = String(text || '').trim();
      if (!t) return;
      const last = contents[contents.length - 1];
      if (last && last.role === role) last.parts[0].text += '\n' + t;
      else contents.push({ role, parts: [{ text: t }] });
    };
    (Array.isArray(o.history) ? o.history : []).slice(-16).forEach((h) => {
      push(h.role === 'model' || h.role === 'assistant' ? 'model' : 'user', h.text);
    });
    push('user', o.prompt || '안녕하세요');
    while (contents.length && contents[0].role === 'model') contents.shift();
    if (!contents.length) contents.push({ role: 'user', parts: [{ text: '안녕하세요' }] });
    /* 첨부(사진·PDF)는 마지막 사용자 턴의 inlineData 파트로 붙인다 */
    const atts = Array.isArray(o.attach) ? o.attach : [];
    if (atts.length) {
      const last = contents[contents.length - 1];
      if (last && last.role === 'user') {
        atts.forEach((a) => {
          if (a && a.data && a.mime) last.parts.push({ inlineData: { mimeType: a.mime, data: a.data } });
        });
      }
    }

    const gen = { temperature: o.json ? 0.7 : 0.6, maxOutputTokens: o.json ? 1600 : 512, topP: 0.95 };
    if (o.json) {
      gen.responseMimeType = 'application/json';
      gen.responseSchema = {
        type: 'ARRAY',
        items: {
          type: 'OBJECT',
          properties: { id: { type: 'STRING' }, text: { type: 'STRING' } },
          required: ['id', 'text']
        }
      };
    }
    const payload = { contents, generationConfig: gen };
    const sys = String(o.system || '').trim();
    if (sys) payload.systemInstruction = { parts: [{ text: sys }] };

    const url = API_BASE + encodeURIComponent(useModel) + ':generateContent?key=' + encodeURIComponent(ai.apiKey);
    const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const limit = o.timeoutMs || 60000;
    const timer = ctrl ? setTimeout(() => { try { ctrl.abort(); } catch (e) { /* 무시 */ } }, limit) : null;

    let res;
    try {
      res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: ctrl ? ctrl.signal : undefined
      });
    } catch (e) {
      if (timer) clearTimeout(timer);
      if (e && e.name === 'AbortError') {
        throw new Error('응답 시간이 초과되었습니다(' + Math.round(limit / 1000) + '초). 인터넷 상태를 확인한 뒤 다시 시도해 주세요.');
      }
      throw new Error('인터넷에 연결하지 못했습니다. Wi-Fi·모바일 데이터를 확인해 주세요. (브라우저가 외부 연결을 막는 경우도 있습니다)');
    }
    if (timer) clearTimeout(timer);

    const raw = await res.text();
    let body = null;
    try { body = JSON.parse(raw); } catch (e) { body = null; }

    if (!res.ok) throw new Error(friendlyApiError(res.status, body || raw));

    const j = body || {};
    const blockReason = j.promptFeedback && j.promptFeedback.blockReason;
    if (blockReason) throw new Error('요청이 안전 정책에 걸렸습니다(' + blockReason + '). 표현을 바꿔 다시 시도해 주세요.');
    const cand = (j.candidates || [])[0];
    const parts = (cand && cand.content && cand.content.parts) || [];
    const text = parts.map((p) => p.text || '').join('').trim();
    if (!text) throw new Error('Gemini가 빈 응답을 돌려줬습니다. 다시 시도해 주세요.');

    const um = j.usageMetadata || {};
    const promptTokens = um.promptTokenCount || 0;
    const outputTokens = (um.candidatesTokenCount || 0) + (um.thoughtsTokenCount || 0);
    const cost = recordUsage(useModel, promptTokens, outputTokens);

    let items = null;
    if (o.json) {
      const cleaned = text.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
      try {
        const parsed = JSON.parse(cleaned);
        if (Array.isArray(parsed)) items = parsed;
      } catch (e) { items = null; }
    }
    return {
      text, items, model: useModel,
      usage: { promptTokens, outputTokens, totalTokens: um.totalTokenCount || (promptTokens + outputTokens) },
      cost: { usd: cost.usd, krw: cost.krw }
    };
  }

    return list.map((m) => {
      const fromOwner = m.type === 'user' || m.senderId === 'owner';
      const who = (assistantById(m.senderId) || {}).name || '비서';
      return {
        role: fromOwner ? 'user' : 'assistant',
        text: (fromOwner ? '' : who + ': ') + String(m.text || '').slice(0, 700)
      };
    });
  }

  function friendlyOpenAIError(status, body) {
    const err = (body && body.error) || {};
    const msg = String(err.message || (typeof body === 'string' ? body : '') || '').slice(0, 240);
    if (status === 401 || /invalid api key|incorrect api key/i.test(msg)) {
      return 'OpenAI 키가 올바르지 않습니다. platform.openai.com → API keys에서 키를 다시 확인해 주세요.';
    }
    if (status === 429) {
      if (/quota|billing|credit|insufficient/i.test(msg)) return 'OpenAI 결제 잔액·한도가 부족합니다. Billing에서 크레딧을 확인해 주세요.';
      return 'OpenAI 요청 한도를 넘었습니다(429). 잠시 후 다시 시도해 주세요.';
    }
    if (status === 403) return '이 키로는 요청이 막혔습니다(403). 키 권한·조직 설정을 확인해 주세요.';
    if (status === 404 || /model.*(not found|does not exist)/i.test(msg)) {
      return '모델을 찾을 수 없습니다. 설정에서 GPT 모델을 다시 골라 주세요.';
    }
    if (status === 400) return 'OpenAI 요청이 거부되었습니다(400): ' + (msg || '모델·입력 형식을 확인해 주세요.');
    return 'OpenAI 호출에 실패했습니다(' + status + '): ' + (msg || '알 수 없는 오류');
  }

  async function callOpenAI(opts) {
    const o = opts || {};
    if (!ai.openaiKey) {
      throw new Error('OpenAI API 키가 없습니다. ⚙️ 설정 → 🧠 OpenAI에 키를 먼저 저장해 주세요.');
    }
    const model = normalizeOpenAIModel(o.model || state.settings.openaiModel);
    const spec = OPENAI_MODELS[model] || OPENAI_MODELS[OPENAI_DEFAULT_MODEL];
    const messages = [];
    const sys = String(o.system || '').trim();
    if (sys) messages.push({ role: 'system', content: sys });
    (Array.isArray(o.history) ? o.history : []).slice(-8).forEach((h) => {
      const t = String((h && h.text) || '').trim();
      if (!t) return;
      messages.push({ role: (h.role === 'assistant' || h.role === 'model') ? 'assistant' : 'user', content: t });
    });
    const prompt = String(o.prompt || '안녕하세요');
    const atts = (Array.isArray(o.attach) ? o.attach : []).filter((x) => x && x.data && x.mime).slice(0, 4);
    if (atts.length) {
      const parts = [{ type: 'text', text: prompt }];
      atts.forEach((x) => parts.push({
        type: 'image_url',
        image_url: { url: 'data:' + x.mime + ';base64,' + x.data }
      }));
      messages.push({ role: 'user', content: parts });
    } else {
      messages.push({ role: 'user', content: prompt });
    }

    const payload = { model: model, messages: messages, max_completion_tokens: o.maxTokens || 1200 };
    /* 생각(reasoning) 모델은 추론 분량을 낮춰 비용·지연을 줄인다 (구형 4o/4.1 계열은 미지원) */
    if (spec.reasoning) payload.reasoning_effort = 'low';

    const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const limit = o.timeoutMs || 90000;
    const timer = ctrl ? setTimeout(() => { try { ctrl.abort(); } catch (e) { /* 무시 */ } }, limit) : null;

    let res;
    try {
      res = await fetch(OPENAI_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + ai.openaiKey
        },
        body: JSON.stringify(payload),
        signal: ctrl ? ctrl.signal : undefined
      });
    } catch (e) {
      if (timer) clearTimeout(timer);
      if (e && e.name === 'AbortError') {
        throw new Error('지피티 응답이 ' + Math.round(limit / 1000) + '초를 넘어 중단했습니다. 다시 시도해 주세요.');
      }
      throw new Error('OpenAI에 연결하지 못했습니다. Wi-Fi·모바일 데이터를 확인해 주세요. (브라우저·네트워크가 api.openai.com을 막는 경우도 있습니다)');
    }
    if (timer) clearTimeout(timer);

    const raw = await res.text();
    let body = null;
    try { body = JSON.parse(raw); } catch (e) { body = null; }
    if (!res.ok) throw new Error(friendlyOpenAIError(res.status, body || raw));

    const j = body || {};
    const ch = (j.choices || [])[0] || {};
    const text = String((ch.message && ch.message.content) || '').trim();
    if (!text) {
      const why = ch.finish_reason ? (' (finish_reason: ' + ch.finish_reason + ')') : '';
      throw new Error('지피티가 빈 응답을 돌려줬습니다' + why + '. 다시 시도해 주세요.');
    }
    const um = j.usage || {};
    const promptTokens = um.prompt_tokens || 0;
    const outputTokens = um.completion_tokens || 0;
    const cost = recordUsage(model, promptTokens, outputTokens);
    return {
      text: text, model: model,
      usage: { promptTokens: promptTokens, outputTokens: outputTokens, totalTokens: um.total_tokens || (promptTokens + outputTokens) },
      cost: { usd: cost.usd, krw: cost.krw }
    };
  }

  /* AI가 돌려준 텍스트에서 [{id,text}] 배열을 최대한 너그럽게 건져낸다 */
  function parseItems(text) {
    const raw = String(text || '').trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
    let v = null;
    try { v = JSON.parse(raw); } catch (e) {
      const m = raw.match(/\[[\s\S]*\]/);
      if (m) { try { v = JSON.parse(m[0]); } catch (e2) { v = null; } }
    }
    if (Array.isArray(v)) return v;
    if (v && typeof v === 'object') {
      // 배열이 아니라 단일 객체({"id":..,"text":..})로 온 경우
      if ((v.id || v.name) && (v.text || v.content)) {
        return [{ id: String(v.id || v.name || ''), text: String(v.text || v.content || '') }];
      }
      for (const k of ['items', 'replies', 'data', 'result']) if (Array.isArray(v[k])) return v[k];
      const arr = Object.keys(v).map((k) => ({
        id: k,
        text: typeof v[k] === 'string' ? v[k] : ((v[k] && v[k].text) || '')
      })).filter((x) => x.text);
      if (arr.length) return arr;
    }
    return null;
  }

  async function aiReplyBatch(targets, text, files) {
    const res = await callGemini({
      system: buildSystem(targets),
      history: historyForAI(),
      prompt: '대장님 지시: ' + text.replace(/@[^\s@,]+/g, '').trim() + attachPromptNote(files) + textAttachmentBlock(files),
      model: state.settings.model,
      json: true,
      attach: attachmentParts(files)
    });
    const items = Array.isArray(res.items) ? res.items : parseItems(res.text);
    const out = {};
    if (Array.isArray(items)) {
      items.forEach((it) => {
        if (!it) return;
        const id = String(it.id || '').trim();
        const t = String(it.text || it.content || '').trim();
        if (!t) return;
        const match = targets.find((a) => a.id === id || a.name === id);
        if (match) out[match.id] = t;
      });
    }
    const got = Object.keys(out).length;
    if (!got) {
      // 형식이 조금 어긋나도 쓸 수 있는 본문이면 건져서 붙인다. (원본 JSON을 그대로 보여주지 않는다)
      const arr = Array.isArray(items) ? items.filter(Boolean) : [];
      const bad = {};
      targets.forEach((a) => { bad[a.id] = 1; bad[a.name] = 1; });
      const texts = arr.map((it) => String(it.text || it.content || '').trim())
        .filter((t) => t && !bad[t] && !/^[[{]/.test(t));
      const plain = String(res.text || '').trim();
      const plainOK = plain && !/^[[{]/.test(plain);
      if (texts.length >= targets.length) {
        targets.forEach((a, i) => { if (texts[i]) out[a.id] = texts[i]; });
      } else if (targets.length === 1) {
        const body = texts.slice().sort((x, y) => y.length - x.length)[0] || (plainOK ? plain : '');
        if (body) out[targets[0].id] = body;
      }
      if (!Object.keys(out).length) {
        return { map: {}, usage: res.usage, cost: res.cost, model: res.model, fallbackLocal: true };
      }
    }
    return { map: out, usage: res.usage, cost: res.cost, model: res.model };
  }

  /* 🧠 @지피티 한 명 호출 — 지침 + 첨부 사진(image_url) + 문서 텍스트를 함께 보낸다 */
  async function gptReply(a, text, files) {
    const list = files || [];
    const pics = list.filter((x) => x.kind === 'image' && x.data);
    const pdfs = list.filter((x) => x.kind === 'pdf');
    let note = attachPromptNote(list);
    if (pdfs.length) {
      note += '\n\n[안내] PDF ' + pdfs.length + '건은 지피티가 직접 읽을 수 없어 이번 답변에서 제외했습니다. PDF 안의 내용이 필요하면 같은 질문을 @니케 등 Gemini 비서에게도 보내 주세요.';
    }
    return await callOpenAI({
      system: buildGptSystem(a),
      history: historyForOpenAI(),
      prompt: '대장님 지시: ' + text.replace(/@[^\s@,]+/g, '').trim() + note + textAttachmentBlock(list),
      model: state.settings.openaiModel,
      attach: pics,
      maxTokens: 1200
    });
  }

  /* ───────── 메시지·작업 ───────── */
  function addMessage(m) {
    const list = state.messages[state.activeRoom];
    const msg = Object.assign({ id: uid('m'), at: nowISO() }, m);
    list.push(msg);
    if (list.length > 400) list.splice(0, list.length - 400);
    return msg;
  }

  function showTyping(a, label) {
    const wrap = $('#chatScroll');
    const el = document.createElement('div');
    el.className = 'm-ai';
    el.id = 'typingRow';
    el.style.setProperty('--tint', a.tint);

  function hideTyping() {

  function touchAssistant(a, report) {
    if (a.countDate !== today()) { a.countDate = today(); a.todayCount = 0; }
    a.todayCount += 1;
    if (report) a.lastReport = report;
    a.status = '대기중';
  }

  function makeTask(a, text) {
    return {
      id: uid('t'),
      title: taskTitleFor(a, text),
      detail: text.replace(/\s+/g, ' ').trim(),
      ownerId: a.id,
      status: '대기',
      room: state.activeRoom,
      createdAt: nowISO(),
      doneAt: null,
      source: '지시'
    };
  }

  function taskTitleFor(a, text) {
    const body = text.replace(/@[^\s@,]+/g, ' ').trim();
    const segs = body.split(/[,，、·]|그리고|및\s/)
      .map((s) => s.trim().replace(/^(그리고|및)\s*/, '').replace(/\s*(하고|하며|면서|이고|이고요)$/, '').replace(/[.,]$/, '').trim())
      .filter((s) => s.length > 3);
    if (segs.length > 1) {
      const pref = {
        hongbo: /(블로그|쇼츠|릴스|인스타|스레드|유튜브|홍보|콘텐츠|게시|카드뉴스)/,
        semsoon: /(세금|미수|거래|청구|정산|입금|결제|부가세|영수증)/,
        gongdol: /(as|수리|출장|복사기|프린터|PC|설치|부품|개발)/i
      }[a.id];
      if (pref) {
        const hit = segs.find((s) => pref.test(s));
        if (hit) return summarize(hit, 40);
      }
    }
    return summarize(text);
  }

  /* ───────── 전송 ───────── */
  async function send() {
    if (busy) return;
    const input = $('#input');
    let text = input.value.trim();
    const files = attach.items.slice();
    const imgMode = !!attach.mode;
    if (!text && !files.length) return;
    const senderId = state.ui.senderId || 'owner';

    if (!text) {
      text = files.some((x) => x.kind !== 'image') ? '첨부한 파일을 읽고 핵심만 정리해 줘.' : '첨부한 사진을 보고 알려 줘.';
    }

    /* 사진·PDF 읽기와 이미지 생성은 Gemini 키가 있어야 합니다.
       단, 지피티(@지피티)에게 사진만 보내는 경우는 OpenAI 키만 있으면 됩니다. */
    if ((files.length || imgMode) && senderId === 'owner' && !ai.enabled) {
      const gptPicOnly = !imgMode && ai.openaiEnabled && parseTargets(text).some((a) => a.id === 'gpt');
      if (!gptPicOnly) {
        toast('⚙️ 사진·PDF 읽기와 이미지 생성은 Google Gemini 키가 필요합니다(지피티는 사진만 읽습니다). 설정에서 AI Studio 키를 넣어 주세요.');
        openSettings();
        return;
      }
    }

    busy = true;
    $('#btnSend').disabled = true;

    addMessage({
      type: senderId === 'owner' ? 'user' : 'assistant', senderId, text,
      atts: files.length ? files.map(attMetaOf) : undefined
    });
    input.value = '';
    input.style.height = 'auto';
    if (btnAttachEl()) btnAttachEl().classList.toggle('on', false);
    clearAttach();
    save();
    renderChatOnly(true);

    if (senderId !== 'owner') {
      const a = assistantById(senderId);
      if (a) a.lastReport = '직접 남긴 메모: ' + summarize(text, 40);
      busy = false; $('#btnSend').disabled = false;
      save(); renderAll();
      toast((a ? a.emoji + ' ' + a.name : '비서') + ' 명의로 남겼습니다.');
      return;
    }

    /* 🎨 이미지 생성 — 모드 버튼 또는 명백한 이미지 요청 */
    if (imgMode || (!files.some((x) => x.kind !== 'image') && looksImageGen(text))) {
      await runImageGen(text, files, imageAuthor(text));
      busy = false; $('#btnSend').disabled = false;
      save(); renderAll();
      return;
    }

    let targets0 = parseTargets(text);
    if (isChitChat(text)) {
      const a = targets0[0] || state.assistants[0];
      await respondOne(a, chatReply(a, text), 380);
      busy = false; $('#btnSend').disabled = false;
      save(); renderAll();
      return;
    }

    /* ── 🧠 지피티(OpenAI)는 Gemini 합본 호출에서 분리한다 ───────── */
    let gemTargets = targets0.slice();
    let gptTarget = null;
    if (targets0.some((a) => a.id === 'gpt')) {
      const onlyGpt = targets0.length === 1;
      gptTarget = targets0.find((a) => a.id === 'gpt');
      gemTargets = targets0.filter((a) => a.id !== 'gpt');
      if (!ai.openaiEnabled) {
        gptTarget = null;
        if (onlyGpt) {
          addMessage({ type: 'system', text: '🔑 지피티를 부르려면 OpenAI API 키가 필요합니다. 설정(⚙️) → 「🧠 OpenAI (지피티)」에 sk-... 키를 넣어 주세요.' });
          renderChatOnly(true);
          save();
          busy = false; $('#btnSend').disabled = false;
          toast('🔑 OpenAI 키가 필요합니다 · 설정을 열었습니다');
          openSettings();
          setTimeout(() => {
            const el = $('#setOpenaiKey');
            if (el) el.scrollIntoView({ block: 'center' });
          }, 260);
          return;
        }
        addMessage({ type: 'system', text: '🧠 지피티는 OpenAI 키 미등록으로 이번 회의에서 건너뜁니다 · 설정에서 키를 넣으면 함께 답합니다.' });
        targets0 = targets0.filter((a) => a.id !== 'gpt');
        renderChatOnly(true);
      }
    }

    const useAI = !!(gemTargets.length && (files.length ? ai.enabled : shouldUseAI(text)));
    const useGPT = !!gptTarget;
    if (useAI || useGPT) {
      const t0 = Date.now();
      let gemRes = null, gemErr = null, gptRes = null, gptErr = null;

      if (useGPT) {
        draft.typingId = gptTarget.id;
        showTyping(gptTarget, '분석 중…');
        renderStaff();
        try { gptRes = await gptReply(gptTarget, text, files); }
        catch (e) { gptErr = e; }
        hideTyping();
      }
      if (useAI) {
        draft.typingId = gemTargets[0].id;
        showTyping(gemTargets[0]);
        renderStaff();
        try { gemRes = await aiReplyBatch(gemTargets, text, files); }
        catch (e) { gemErr = e; }
        hideTyping();
      }
      const elapsed = Date.now() - t0;

      if (gptErr) addMessage({ type: 'system', text: '🧠 지피티 호출 실패 — ' + gptErr.message });
      if (gemRes && gemRes.fallbackLocal) {
        addMessage({ type: 'system', text: 'AI 응답 형식을 읽지 못해 이번 지시는 로컬 응답으로 대체했습니다.' });
      }
      if (gemErr) {
        addMessage({ type: 'system', text: 'AI 호출 실패 — ' + gemErr.message });
        addMessage({ type: 'system', text: '이번 지시는 로컬 스마트 모드(무료)로 대신 답합니다.' });
      }
      renderChatOnly(true);

      for (const a of targets0) {
        let body = '', tag = '로컬';
        if (a.id === 'gpt') {
          if (gptRes && gptRes.text) { body = gptRes.text; tag = 'GPT'; }
        } else if (gemRes && gemRes.map && gemRes.map[a.id]) {
          body = gemRes.map[a.id]; tag = 'AI';
        }
        if (!body) body = smartReply(a, text).text;
        addMessage({ type: 'assistant', senderId: a.id, text: body, tag: tag });
        state.tasks.unshift(makeTask(a, text));
        touchAssistant(a, summarize(body, 60));
        renderChatOnly(true);
        await sleep(240);
      }
      draft.typingId = null;
      busy = false; $('#btnSend').disabled = false;
      save(); renderAll();
      const totalKrw = (gemRes && gemRes.cost ? gemRes.cost.krw : 0) + (gptRes && gptRes.cost ? gptRes.cost.krw : 0);
      const calls = (gemRes ? 1 : 0) + (gptRes ? 1 : 0);
      if (calls) {
        toast('🤖 AI ' + calls + '회 호출 · ' + targets0.length + '명 응답 · 약 ' + wonText(totalKrw) + ' (' + (elapsed / 1000).toFixed(1) + '초)');
      } else {
        toast('🤖 AI 응답 완료 · ' + targets0.length + '명');
      }
      return;
    }

    for (const a of targets0) {
      draft.typingId = a.id;
      showTyping(a);
      renderStaff();
      const reply = smartReply(a, text);
      const wait = 340 + Math.min(760, reply.text.length * 5);
      await sleep(wait);
      hideTyping();
      addMessage({ type: 'assistant', senderId: a.id, text: reply.text, tag: '로컬' });
      state.tasks.unshift(makeTask(a, text));
      touchAssistant(a, summarize(reply.text, 60));
      renderChatOnly(true);
      renderTasks(); renderStaff(); renderTabs();
      await sleep(140);
    }
    draft.typingId = null;
    busy = false; $('#btnSend').disabled = false;
    save(); renderAll(); renderCost();
    if ((ai.enabled || ai.openaiEnabled) && !useAI) {
      toast('⚡ 스마트 절약 모드 · 로컬 응답(무료) · 작업실에 ' + targets0.length + '건 등록');
    } else {
      toast('📋 작업실에 ' + targets0.length + '건 등록했습니다');
    }
  }

  async function respondOne(a, reply, wait) {
    draft.typingId = a.id;
    showTyping(a);
    renderStaff();
    await sleep(wait || 380);
    hideTyping();
    draft.typingId = null;
    addMessage({ type: 'assistant', senderId: a.id, text: reply.text, tag: reply.tag });
    touchAssistant(a, summarize(reply.text, 60));
    renderChatOnly(true);
    renderStaff(); renderTabs();
  }

  /* ───────── 토스트 ───────── */
  function toast(msg) {
    const wrap = $('#toastWrap');
    if (!wrap) return;
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; }, 2800);
    setTimeout(() => el.remove(), 3400);
  }

  /* ───────── 작업/메모 조작 ───────── */
  function taskAction(act, id) {
    const t = state.tasks.find((x) => x.id === id);
    if (!t) return;
    const a = assistantById(t.ownerId);

  /* ───────── 파일 저장/불러오기 ───────── */
  function downloadFile(name, content, mime) {
    try {
      const blob = new Blob([content], { type: (mime || 'text/plain') + ';charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      toast('내려받았습니다: ' + name);
    } catch (e) {
      toast('파일 저장에 실패했습니다. 브라우저 다운로드 설정을 확인해 주세요.');
    }
  }
